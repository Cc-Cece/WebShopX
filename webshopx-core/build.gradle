sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
            include 'com/webshopx/core/**'
            include extractedCoreSources
        }
        resources {
            srcDir rootProject.file('src/main/resources')
            srcDir rootProject.layout.buildDirectory.dir('generated-resources/main')
            include 'db/sqlite/**'
            include 'db/mysql/**'
            include 'web/**'
        }
    }
}

tasks.named('processResources') {
    mustRunAfter rootProject.tasks.named('syncWebFrontend')
}

test {
    useJUnitPlatform { excludeTags 'performance' }
}

tasks.register('performanceBudget', Test) {
    group = 'verification'
    description = 'Runs bounded RC performance probes and writes their machine-readable measurements.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'performance' }
    def report = layout.buildDirectory.file('reports/mod-migration/performance-budget.json')
    outputs.file(report)
    systemProperty 'webshopx.performance.report', report.get().asFile.absolutePath
}

tasks.register('browserAcceptanceFixture', JavaExec) {
    group = 'verification'
    description = 'Runs the shared HTTP API until the browser acceptance stop file is created.'
    classpath = sourceSets.test.runtimeClasspath
    dependsOn rootProject.tasks.named('syncWebFrontend')
    mainClass = 'com.webshopx.core.BrowserAcceptanceFixtureMain'
    args providers.gradleProperty('browserFixturePort').orElse('8123').get(),
            providers.gradleProperty('browserFixtureDirectory')
                    .orElse(layout.buildDirectory.dir('tmp/browser-acceptance').get().asFile.absolutePath).get()
}

tasks.register('verifyPlatformIsolation') {
    group = 'verification'
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = ['org/bukkit/', 'io/papermc/', 'net/minecraft/', 'net/fabricmc/', 'net/minecraftforge/', 'net/neoforged/']
        def violations = []
        sourceSets.main.output.classesDirs.files.each { dir ->
            if (!dir.exists()) return
            fileTree(dir).matching { include '**/*.class' }.files.each { classFile ->
                byte[] bytes = classFile.bytes
                String constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                forbidden.each { token ->
                    if (constants.contains(token)) violations << "${classFile.name}: ${token}"
                }
            }
        }
        if (!violations.isEmpty()) throw new GradleException("Core platform leakage: ${violations}")
    }
}

check.dependsOn tasks.named('verifyPlatformIsolation')
