plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

String targetRuntime = rootProject.hasProperty('targetRuntime')
        ? rootProject.property('targetRuntime').toString().trim().toLowerCase(java.util.Locale.ROOT)
        : '1.20.6+'
boolean legacy18Runtime = targetRuntime == '1.18.2+'
int runtimeJavaLanguageVersion = legacy18Runtime ? 17 : 21
JavaVersion runtimeJavaVersion = legacy18Runtime ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21

java {
    sourceCompatibility = runtimeJavaVersion
    targetCompatibility = runtimeJavaVersion
}

repositories {
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
        content {
            includeModule("io.papermc.paper", "paper-api")
            includeModule("net.md-5", "bungeecord-chat")
            includeGroup("io.papermc.adventure")
        }
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'minecraft'
        url = 'https://libraries.minecraft.net'
        content {
            includeModule("com.mojang", "brigadier")
        }
    }
    mavenCentral()
}

dependencies {
    api project(':webshopx-platform-api')
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation('org.mariadb.jdbc:mariadb-java-client:3.3.3') {
        exclude group: 'com.github.waffle', module: 'waffle-jna'
    }
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    compileOnly "io.papermc.paper:paper-api:${legacy18Runtime ? '1.18.2-R0.1-SNAPSHOT' : '1.20.6-R0.1-SNAPSHOT'}"
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = runtimeJavaLanguageVersion
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'WebShopX Core M2',
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'com.webshopx.core'
        )
    }
}
