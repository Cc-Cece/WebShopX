plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    api project(':webshopx-platform-api')
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

def extractedCoreSources = [
        'com/webshopx/AdminPermission.java',
        'com/webshopx/AdminRole.java',
        'com/webshopx/ClaimTokenGenerator.java',
        'com/webshopx/CurrencyType.java',
        'com/webshopx/DatabaseDialect.java',
        'com/webshopx/DbType.java',
        'com/webshopx/MapUtils.java',
        'com/webshopx/MarketSide.java',
        'com/webshopx/MarketTagCodes.java',
        'com/webshopx/MysqlDialect.java',
        'com/webshopx/MysqlSqlProvider.java',
        'com/webshopx/PasswordHasher.java',
        'com/webshopx/RechargeOrderStatus.java',
        'com/webshopx/ServiceException.java',
        'com/webshopx/SqliteDialect.java',
        'com/webshopx/SqliteSqlProvider.java',
        'com/webshopx/SqlProvider.java',
        'com/webshopx/TimeSupport.java'
]

sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
            include 'com/webshopx/core/**'
            include extractedCoreSources
        }
        resources {
            srcDir rootProject.file('src/main/resources')
            include 'db/sqlite/**'
            include 'db/mysql/**'
        }
    }
}

test { useJUnitPlatform() }

tasks.register('verifyPlatformIsolation') {
    group = 'verification'
    dependsOn tasks.named('classes')
    doLast {
        def forbidden = ['org/bukkit/', 'io/papermc/', 'net/minecraft/', 'net/fabricmc/', 'net/minecraftforge/', 'net/neoforged/']
        def violations = []
        sourceSets.main.output.classesDirs.files.each { dir ->
            if (!dir.exists()) return
            fileTree(dir).matching { include '**/*.class' }.files.each { classFile ->
                byte[] bytes = classFile.bytes
                String constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                forbidden.each { token ->
                    if (constants.contains(token)) violations << "${classFile.name}: ${token}"
                }
            }
        }
        if (!violations.isEmpty()) throw new GradleException("Core platform leakage: ${violations}")
    }
}

check.dependsOn tasks.named('verifyPlatformIsolation')
