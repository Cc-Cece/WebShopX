tasks.register('verifyRcEvidence') {
    group = 'verification'
    description = 'Fails closed unless immutable required-check evidence matches the current source and candidate hashes.'
    dependsOn tasks.named('localReadiness')
    def evidencePath = providers.gradleProperty('rcEvidence')
    inputs.property('rcEvidence', evidencePath.orElse(''))
    doLast {
        if (!evidencePath.isPresent()) {
            throw new GradleException('RC evidence is required. Pass -PrcEvidence=<required-checks.json>.')
        }
        def evidenceFile = file(evidencePath.get())
        if (!evidenceFile.isFile()) {
            throw new GradleException("RC evidence file does not exist: ${evidenceFile}")
        }
        def evidence = new groovy.json.JsonSlurper().parse(evidenceFile)
        def commit = gitText('rev-parse', 'HEAD')
        if (evidence.schemaVersion != 1 || evidence.sourceCommit != commit) {
            throw new GradleException("RC evidence source mismatch. expected=${commit}, actual=${evidence.sourceCommit}")
        }
        def required = [
                'paper-regression', 'paper-folia-real-server', 'contracts-and-artifacts',
                'frontend-lint-types-unit-build', 'reproducible-clean-cache',
                'database-mariadb', 'database-mysql', 'redis-relay',
                'mixed-cluster', 'migration-reconciliation', 'rollback-restore',
                'real-player-item-corpus',
                'server-fabric-1.18.2', 'server-fabric-1.19.4',
                'server-fabric-1.20', 'server-fabric-1.20.4',
                'server-fabric-1.20.5', 'server-fabric-26.2',
                'server-forge-1.18.2', 'server-forge-1.19.4',
                'server-forge-1.20', 'server-forge-1.20.1',
                'server-neoforge-1.20.1', 'server-neoforge-1.20.2', 'server-neoforge-26.2',
                'dependency-scan', 'security-scan', 'codeql', 'license-scan', 'sbom-validate',
                'browser-landing', 'browser-health', 'browser-critical-journeys',
                'browser-route-matrix'
        ] as Set
        def checks = (evidence.checks ?: []).collectEntries { check -> [(check.id): check] }
        def missing = required - checks.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("RC evidence is missing required checks: ${missing.sort()}")
        }
        required.each { id ->
            def check = checks[id]
            java.time.Instant generatedAt
            try {
                generatedAt = java.time.Instant.parse(check.generatedAtUtc?.toString())
            } catch (RuntimeException ignored) {
                throw new GradleException("RC check has a missing or invalid timestamp: ${id}")
            }
            def now = java.time.Instant.now()
            if (check.status != 'passed' || check.sourceCommit != commit || !check.environment ||
                    !(check.evidenceSha256 ==~ /[0-9a-f]{64}/) ||
                    generatedAt.isAfter(now.plusSeconds(300)) || generatedAt.isBefore(now.minusSeconds(86_400))) {
                throw new GradleException("RC check is skipped, stale or incomplete: ${id}")
            }
        }
        def manifestFile = layout.buildDirectory.file('reports/mod-migration/release-manifest.json').get().asFile
        def sbomFile = layout.buildDirectory.file('reports/mod-migration/mod-sbom.spdx.json').get().asFile
        def sha256 = { File candidate -> java.security.MessageDigest.getInstance('SHA-256')
                .digest(candidate.bytes).encodeHex().toString() }
        if (evidence.releaseManifestSha256 != sha256(manifestFile) ||
                evidence.sbomSha256 != sha256(sbomFile)) {
            throw new GradleException('RC evidence artifact hashes do not match the current manifest/SBOM.')
        }
    }
}

tasks.register('releaseReadiness') {
    group = 'verification'
    description = 'Validates local gates and immutable external RC evidence; missing or stale evidence fails closed.'
    dependsOn tasks.named('verifyRcEvidence')
}

