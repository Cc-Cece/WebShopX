                        [gate: 'shared product contract', reason: 'Paper and Loader full route/use-case parity is not yet proven'],
                        [gate: 'supported version matrix', reason: 'Every promised version/compatibility interval lacks immutable real-server evidence'],
                        [gate: 'real player and item corpus', reason: 'Real player, third-party item and failure-recovery evidence is incomplete'],
                        [gate: 'mixed cluster', reason: 'Paper/Fabric/Forge/NeoForge shared MariaDB and Redis reconciliation evidence is incomplete'],
                        [gate: 'migration and rollback', reason: 'Production-like snapshot migration, restore and rollback reconciliation evidence is incomplete'],
                        [gate: 'interactive browser critical journeys', reason: 'Authenticated user/admin journeys and failure-state browser evidence is incomplete'],
                        [gate: 'supply chain and RC', reason: 'Complete artifact SBOM, security scans and reproducible clean-cache RC evidence is incomplete'],
                        [gate: 'remote review workflow', reason: 'Traceable implementation PR and all required checks are not yet available']
