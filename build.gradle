jar.enabled = false
assemble.dependsOn(tasks.named('packagePluginVariants'))

tasks.register('printProjectName') {
    doLast {
        println rootProject.name
    }
}

tasks.register('verifyPaperBaselineArtifact') {
    group = 'verification'
    description = 'Checks the deterministic plain Paper baseline artifact and its required metadata.'
    dependsOn tasks.named('plainPluginJar')

    doLast {
        def artifact = tasks.named('plainPluginJar', Jar).get().archiveFile.get().asFile
        if (!artifact.isFile()) {
            throw new GradleException("Paper baseline artifact was not created: ${artifact}")
        }
        def requiredEntries = [
                'plugin.yml',
                'config.yml',
                'db/sqlite/schema.sql',
                'com/webshopx/WebShopPlugin.class'
        ]
        def zip = new java.util.zip.ZipFile(artifact)
        def entries
        try {
            entries = zip.entries().collect { it.name } as Set
        } finally {
            zip.close()
        }
        def missing = requiredEntries.findAll { !entries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Paper baseline artifact is missing required entries: ${missing}")
        }
        println "Paper baseline artifact: ${artifact} (${artifact.length()} bytes)"
    }
}

tasks.register('paperBaseline') {
    group = 'verification'
    description = 'Runs the reproducible, frontend-independent Paper regression baseline.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('verifyPaperBaselineArtifact')
}

