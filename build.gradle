import com.github.spotbugs.snom.SpotBugsTask
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'checkstyle'
    id "com.github.spotbugs" version "6.4.8"
    id 'com.gradleup.shadow' version '9.3.1'
    id 'java'
}

version = 'dev-v3.0.0'

group = "com.webshopx"
String targetRuntime = hasProperty('targetRuntime')
        ? property('targetRuntime').toString().trim().toLowerCase(Locale.ROOT)
        : '1.20.6+'

subprojects {
    group = rootProject.group
    version = rootProject.version
    repositories {
        mavenCentral()
    }
}
if (!(targetRuntime in ['26.2+', '26.1+', '1.20.6+', '1.18.2+'])) {
    throw new GradleException("Unsupported targetRuntime: ${targetRuntime}. Allowed values: 26.2+, 26.1+, 1.20.6+, 1.18.2+")
}
boolean legacy18Runtime = targetRuntime == '1.18.2+'
boolean minecraft26Runtime = targetRuntime in ['26.1+', '26.2+']
boolean minecraft261Runtime = targetRuntime == '26.1+'
boolean includeFoliaVariants = !legacy18Runtime
JavaVersion runtimeJavaVersion = legacy18Runtime
        ? JavaVersion.VERSION_17
        : minecraft26Runtime ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
int runtimeJavaLanguageVersion = legacy18Runtime ? 17 : minecraft26Runtime ? 25 : 21
String runtimePaperApiVersion = legacy18Runtime
        ? '1.18.2-R0.1-SNAPSHOT'
        : minecraft261Runtime ? '26.1.2.build.+' : minecraft26Runtime ? '26.2.build.+' : '1.20.6-R0.1-SNAPSHOT'
String runtimePluginApiVersion = legacy18Runtime ? '1.18' : minecraft261Runtime ? '26.1' : minecraft26Runtime ? '26.2' : '1.20'
String runtimeClassifierSuffix = targetRuntime
String foliaClassifierSuffix = minecraft26Runtime ? targetRuntime : '1.19.4+'

def variantClassifier = { String baseClassifier ->
    "${baseClassifier}-${runtimeClassifierSuffix}"
}

def foliaVariantClassifier = { String baseClassifier ->
    "${baseClassifier}-${foliaClassifierSuffix}"
}

static boolean isTruthy(Object value) {
    if (value == null) {
        return false
    }
    String normalized = value.toString().trim().toLowerCase(Locale.ROOT)
    return normalized.isEmpty() || normalized == "true" || normalized == "1" || normalized == "yes" || normalized == "on"
}

if (hasProperty('ver')) {
    String overrideVersion = ver.toString().trim()
    if (!overrideVersion.isEmpty()) {
        if (overrideVersion.startsWith("v") || overrideVersion.startsWith("V")) {
            overrideVersion = overrideVersion.substring(1)
        }
        version = overrideVersion
    }
}

if (hasProperty('snapshot') && isTruthy(property('snapshot')) && !version.toString().endsWith('-SNAPSHOT')) {
    version = version.toString() + '-SNAPSHOT'
}

java {
    sourceCompatibility = runtimeJavaVersion
    targetCompatibility = runtimeJavaVersion
    toolchain {
        languageVersion = JavaLanguageVersion.of(runtimeJavaLanguageVersion)
    }
}

repositories {
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
        content {
            includeModule("io.papermc.paper", "paper-api")
            includeModule("net.md-5", "bungeecord-chat")
            includeGroup("io.papermc.adventure")
        }
    }

    maven {
        name = 'minecraft'
        url = 'https://libraries.minecraft.net'
        content {
            includeModule("com.mojang", "brigadier")
        }
    }

    mavenCentral()

    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

configurations {
    proguard
}

dependencies {
    implementation project(':webshopx-loader-runtime')
    compileOnly "io.papermc.paper:paper-api:${runtimePaperApiVersion}"
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.8'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'com.tchristofferson:ConfigUpdater:2.2'
    implementation('org.mariadb.jdbc:mariadb-java-client:3.3.3') {
        exclude group: 'com.github.waffle', module: 'waffle-jna'
    }
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'redis.clients:jedis:5.2.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.Querz:NBT:6.1'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
    testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.8'
    testImplementation "io.papermc.paper:paper-api:${runtimePaperApiVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:mariadb:1.21.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    proguard 'com.guardsquare:proguard-base:7.7.0'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = runtimeJavaLanguageVersion
}

sourceSets {
    main {
        java {
            exclude 'com/webshopx/AdminPermission.java'
            exclude 'com/webshopx/AdminRole.java'
            exclude 'com/webshopx/ClaimTokenGenerator.java'
            exclude 'com/webshopx/ClaimTokenRepository.java'
            exclude 'com/webshopx/CurrencyType.java'
            exclude 'com/webshopx/DatabaseDialect.java'
            exclude 'com/webshopx/DbType.java'
            exclude 'com/webshopx/MapUtils.java'
            exclude 'com/webshopx/InventoryLockManager.java'
            exclude 'com/webshopx/MarketAlgorithmRegistry.java'
            exclude 'com/webshopx/MarketSide.java'
            exclude 'com/webshopx/MarketTagCodes.java'
            exclude 'com/webshopx/MysqlDialect.java'
            exclude 'com/webshopx/MysqlSqlProvider.java'
            exclude 'com/webshopx/PasswordHasher.java'
            exclude 'com/webshopx/RechargeOrderStatus.java'
            exclude 'com/webshopx/RelayRpcRequest.java'
            exclude 'com/webshopx/RelayRpcResponse.java'
            exclude 'com/webshopx/ServiceException.java'
            exclude 'com/webshopx/SqliteDialect.java'
            exclude 'com/webshopx/SqliteSqlProvider.java'
            exclude 'com/webshopx/SqlProvider.java'
            exclude 'com/webshopx/TimeSupport.java'
            exclude 'com/webshopx/payment/api/**'
        }
        resources {
            srcDir layout.buildDirectory.dir('generated-resources/main')
        }
    }
}

def syncWebFrontend = tasks.register('syncWebFrontend', Exec) {
    group = 'build'
    description = 'Builds webshopx-web and stages it as generated plugin resources.'
    workingDir projectDir
    outputs.dir layout.buildDirectory.dir('generated-resources/main/web')
    if (project.hasProperty('frontendDir')) {
        inputs.dir(file(project.property('frontendDir')))
    }
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', file('tools/sync-web-frontend.ps1').absolutePath
    } else {
        commandLine 'pwsh', '-NoProfile',
                '-File', file('tools/sync-web-frontend.ps1').absolutePath
    }
    if (project.hasProperty('frontendDir')) {
        args '-FrontendDir', file(project.property('frontendDir')).absolutePath
    }
}

processResources {
    mustRunAfter syncWebFrontend
    filesMatching("**/plugin*.yml") {
        expand(
                NAME: rootProject.name,
                VERSION: version,
                PACKAGE: rootProject.group.toString(),
                API_VERSION: runtimePluginApiVersion
        )
    }
}

checkstyle {
    toolVersion = '12.3.0'
    // Preserve the existing warning baseline while still failing when it increases.
    maxWarnings = 2817
}

configurations.checkstyle {
    resolutionStrategy.capabilitiesResolution.withCapability("com.google.collections:google-collections") {
        select("com.google.guava:guava:23.0")
    }
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

tasks.withType(SpotBugsTask).configureEach {
    // The existing codebase has medium-priority findings; high-priority findings remain blocking.
    reportLevel = 'high'
    reports.create("html") {
        required = true
    }
    reports.create("xml") {
        required = false
    }
}

def SQLITE_NATIVE_ROOT = "org/sqlite/native/"
def SQLITE_NON_LINUX_NATIVE_GLOBS = [
        "${SQLITE_NATIVE_ROOT}Windows/**",
        "${SQLITE_NATIVE_ROOT}Mac/**",
        "${SQLITE_NATIVE_ROOT}FreeBSD/**",
        "${SQLITE_NATIVE_ROOT}Linux-Android/**"
]
def SQLITE_NON_WINDOWS_NATIVE_GLOBS = [
        "${SQLITE_NATIVE_ROOT}Linux/**",
        "${SQLITE_NATIVE_ROOT}Linux-Musl/**",
        "${SQLITE_NATIVE_ROOT}Linux-Android/**",
        "${SQLITE_NATIVE_ROOT}Mac/**",
        "${SQLITE_NATIVE_ROOT}FreeBSD/**"
]

def configureShadowVariant = { ShadowJar task, String classifier ->
    task.group = 'build'
    task.archiveClassifier.set(variantClassifier(classifier))
    task.from(sourceSets.main.output) {
        exclude 'plugin-slim.yml'
    }
    task.configurations = [project.configurations.runtimeClasspath]
    task.relocate 'org.bstats', "${project.group}.libs.bstats"
    task.relocate 'org.mariadb.jdbc', "${project.group}.libs.mariadb"
    task.relocate 'com.zaxxer.hikari', "${project.group}.libs.hikari"
    task.mergeServiceFiles()
}

def configureFoliaShadowVariant = { ShadowJar task, String classifier ->
    task.group = 'build'
    task.archiveClassifier.set(foliaVariantClassifier(classifier))
    task.from(sourceSets.main.output) {
        exclude 'plugin.yml'
        exclude 'plugin-slim.yml'
        rename('plugin-folia.yml', 'plugin.yml')
    }
    task.configurations = [project.configurations.runtimeClasspath]
    task.relocate 'org.bstats', "${project.group}.libs.bstats"
    task.relocate 'org.mariadb.jdbc', "${project.group}.libs.mariadb"
    task.relocate 'com.zaxxer.hikari', "${project.group}.libs.hikari"
    task.mergeServiceFiles()
}

shadowJar {
    configureShadowVariant(delegate as ShadowJar, 'full')
}

tasks.register('slimJar', Jar) {
    group = 'build'
    description = "Builds the slim plugin JAR without bundled runtime dependencies for ${targetRuntime}."
    archiveClassifier.set(variantClassifier('slim'))
    from(sourceSets.main.output) {
        exclude 'plugin.yml'
        rename('plugin-slim.yml', 'plugin.yml')
    }
}

tasks.register('foliaPreviewJar', Jar) {
    group = 'build'
    description = "Builds a Folia metadata preview JAR for ${targetRuntime} (not included in default release variants)."
    archiveClassifier.set(foliaVariantClassifier('folia-preview'))
    from(sourceSets.main.output) {
        exclude 'plugin.yml'
        exclude 'plugin-slim.yml'
        rename('plugin-folia.yml', 'plugin.yml')
    }
}

tasks.register('foliaSlimJar', Jar) {
    group = 'build'
    description = "Builds the Folia slim plugin JAR without bundled runtime dependencies for ${targetRuntime}."
    archiveClassifier.set(foliaVariantClassifier('slim-folia'))
    from(sourceSets.main.output) {
        exclude 'plugin.yml'
        exclude 'plugin-slim.yml'
        rename('plugin-folia.yml', 'plugin.yml')
    }
}

tasks.register('fullLinuxJar', ShadowJar) {
    description = "Builds the full plugin JAR with Linux SQLite natives only for ${targetRuntime}."
    configureShadowVariant(delegate as ShadowJar, 'full-linux')
    SQLITE_NON_LINUX_NATIVE_GLOBS.each { exclude it }
}

tasks.register('fullWinJar', ShadowJar) {
    description = "Builds the full plugin JAR with Windows SQLite natives only for ${targetRuntime}."
    configureShadowVariant(delegate as ShadowJar, 'full-win')
    SQLITE_NON_WINDOWS_NATIVE_GLOBS.each { exclude it }
}

tasks.register('fullFoliaJar', ShadowJar) {
    description = "Builds the full plugin JAR with Folia metadata for ${targetRuntime}."
    configureFoliaShadowVariant(delegate as ShadowJar, 'full-folia')
}

tasks.register('fullFoliaLinuxJar', ShadowJar) {
    description = "Builds the Folia full plugin JAR with Linux SQLite natives only for ${targetRuntime}."
    configureFoliaShadowVariant(delegate as ShadowJar, 'full-linux-folia')
    SQLITE_NON_LINUX_NATIVE_GLOBS.each { exclude it }
}

tasks.register('fullFoliaWinJar', ShadowJar) {
    description = "Builds the Folia full plugin JAR with Windows SQLite natives only for ${targetRuntime}."
    configureFoliaShadowVariant(delegate as ShadowJar, 'full-win-folia')
    SQLITE_NON_WINDOWS_NATIVE_GLOBS.each { exclude it }
}

tasks.register('packagePluginVariants') {
    group = 'build'
    description = includeFoliaVariants
            ? "Builds slim/full/full-linux/full-win and Folia slim/full/full-linux/full-win plugin variants for ${targetRuntime}."
            : "Builds slim/full/full-linux/full-win plugin variants for ${targetRuntime}."
    dependsOn tasks.named('slimJar')
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('fullLinuxJar')
    dependsOn tasks.named('fullWinJar')
    if (includeFoliaVariants) {
        dependsOn tasks.named('foliaSlimJar')
        dependsOn tasks.named('fullFoliaJar')
        dependsOn tasks.named('fullFoliaLinuxJar')
        dependsOn tasks.named('fullFoliaWinJar')
    }
}

tasks.named('packagePluginVariants') {
    dependsOn syncWebFrontend
}

[
        'shadowJar',
        'slimJar',
        'foliaSlimJar',
        'fullLinuxJar',
        'fullWinJar',
        'fullFoliaJar',
        'fullFoliaLinuxJar',
        'fullFoliaWinJar'
].each { taskName ->
    tasks.named(taskName) {
        dependsOn syncWebFrontend
    }
}

tasks.register('plainPluginJar', Jar) {
    group = 'build'
    description = 'Packages compiled plugin classes and resources without bundled dependencies.'
    archiveClassifier.set('plain-plugin')
    destinationDirectory.set(layout.buildDirectory.dir('tmp/plain-plugin'))
    from sourceSets.main.output
}

tasks.register('obfuscatePluginJar', JavaExec) {
    group = 'build'
    description = 'Obfuscates plugin classes and resources before dependency shading.'
    dependsOn tasks.named('plainPluginJar')

    classpath = configurations.proguard
    mainClass.set('proguard.ProGuard')

    def plainPluginOutput = tasks.named('plainPluginJar', Jar).flatMap { it.archiveFile }
    def rulesFile = layout.projectDirectory.file('proguard-rules.pro')
    def outputFile = layout.buildDirectory.file("tmp/proguard/${rootProject.name}-plugin-obf.jar")
    def javaHome = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(runtimeJavaLanguageVersion)
    }.get().metadata.installationPath.asFile
    def jmodsDir = new File(javaHome, 'jmods')

    inputs.file(plainPluginOutput)
    inputs.file(rulesFile)
    outputs.file(outputFile)

    doFirst {
        if (!jmodsDir.isDirectory()) {
            throw new GradleException("JDK jmods directory not found: ${jmodsDir}")
        }

        args = ['-injars', plainPluginOutput.get().asFile.absolutePath,
                '-outjars', outputFile.get().asFile.absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.base.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.net.http.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.logging.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.sql.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'jdk.httpserver.jmod').absolutePath]

        configurations.compileClasspath.resolve().each { dependencyJar ->
            args += ['-libraryjars', dependencyJar.absolutePath]
        }

        args += ['@' + rulesFile.asFile.absolutePath]
    }
}

tasks.register('obfuscatedJar', ShadowJar) {
    group = 'build'
    description = 'Builds the obfuscated plugin JAR with bundled runtime dependencies.'
    dependsOn tasks.named('obfuscatePluginJar')

    archiveClassifier.set(variantClassifier('obf'))
    from({
        zipTree(layout.buildDirectory.file("tmp/proguard/${rootProject.name}-plugin-obf.jar").get().asFile)
    })
    configurations = [project.configurations.runtimeClasspath]
    relocate 'org.bstats', "${project.group}.libs.bstats"
    relocate 'org.mariadb.jdbc', "${project.group}.libs.mariadb"
    relocate 'com.zaxxer.hikari', "${project.group}.libs.hikari"
    mergeServiceFiles()
}

tasks.register('releaseObfuscated') {
    group = 'build'
    description = 'Builds the obfuscated release JAR with a stable filename.'
    dependsOn tasks.named('obfuscatedJar')

    doLast {
        def obfuscatedFile = tasks.named('obfuscatedJar', ShadowJar).get().archiveFile.get().asFile
        def releaseFile = layout.buildDirectory.file("libs/${rootProject.name}-release-obf-${runtimeClassifierSuffix}.jar").get().asFile
        if (releaseFile.exists()) {
            releaseFile.delete()
        }
        if (!obfuscatedFile.renameTo(releaseFile)) {
            throw new GradleException("Failed to rename ${obfuscatedFile.name} to ${releaseFile.name}")
        }
    }
}

