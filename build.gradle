    destinationDirectory.set(layout.buildDirectory.dir('tmp/plain-plugin'))
    from sourceSets.main.output
}

tasks.register('obfuscatePluginJar', JavaExec) {
    group = 'build'
    description = 'Obfuscates plugin classes and resources before dependency shading.'
    dependsOn tasks.named('plainPluginJar')

    classpath = configurations.proguard
    mainClass.set('proguard.ProGuard')

    def plainPluginOutput = tasks.named('plainPluginJar', Jar).flatMap { it.archiveFile }
    def rulesFile = layout.projectDirectory.file('proguard-rules.pro')
    def outputFile = layout.buildDirectory.file("tmp/proguard/${rootProject.name}-plugin-obf.jar")
    def javaHome = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(runtimeJavaLanguageVersion)
    }.get().metadata.installationPath.asFile
    def jmodsDir = new File(javaHome, 'jmods')

    inputs.file(plainPluginOutput)
    inputs.file(rulesFile)
    outputs.file(outputFile)

    doFirst {
        if (!jmodsDir.isDirectory()) {
            throw new GradleException("JDK jmods directory not found: ${jmodsDir}")
        }

        args = ['-injars', plainPluginOutput.get().asFile.absolutePath,
                '-outjars', outputFile.get().asFile.absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.base.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.net.http.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.logging.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'java.sql.jmod').absolutePath,
                '-libraryjars', new File(jmodsDir, 'jdk.httpserver.jmod').absolutePath]

        configurations.compileClasspath.resolve().each { dependencyJar ->
            args += ['-libraryjars', dependencyJar.absolutePath]
        }

        args += ['@' + rulesFile.asFile.absolutePath]
    }
}

tasks.register('obfuscatedJar', ShadowJar) {
    group = 'build'
    description = 'Builds the obfuscated plugin JAR with bundled runtime dependencies.'
    dependsOn tasks.named('obfuscatePluginJar')

    archiveClassifier.set(variantClassifier('obf'))
    from({
        zipTree(layout.buildDirectory.file("tmp/proguard/${rootProject.name}-plugin-obf.jar").get().asFile)
    })
    configurations = [project.configurations.runtimeClasspath]
    relocate 'org.bstats', "${project.group}.libs.bstats"
    relocate 'org.mariadb.jdbc', "${project.group}.libs.mariadb"
    relocate 'com.zaxxer.hikari', "${project.group}.libs.hikari"
    mergeServiceFiles()
}

tasks.register('releaseObfuscated') {
    group = 'build'
    description = 'Builds the obfuscated release JAR with a stable filename.'
    dependsOn tasks.named('obfuscatedJar')

    doLast {
        def obfuscatedFile = tasks.named('obfuscatedJar', ShadowJar).get().archiveFile.get().asFile
        def releaseFile = layout.buildDirectory.file("libs/${rootProject.name}-release-obf-${runtimeClassifierSuffix}.jar").get().asFile
        if (releaseFile.exists()) {
            releaseFile.delete()
        }
        if (!obfuscatedFile.renameTo(releaseFile)) {
            throw new GradleException("Failed to rename ${obfuscatedFile.name} to ${releaseFile.name}")
        }
    }
}

