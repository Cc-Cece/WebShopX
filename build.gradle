}

tasks.register('verifyModMetadata') {
    group = 'verification'
    description = 'Checks Loader metadata, entrypoints and cross-loader isolation in all Mod JARs.'
    dependsOn modArtifactProjects.collect { "${it}:verifyLoaderMetadata" }
