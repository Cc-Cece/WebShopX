def configureShadowVariant = { ShadowJar task, String classifier ->
    task.group = 'build'
    task.archiveClassifier.set(variantClassifier(classifier))
    task.from(sourceSets.main.output) {
        exclude 'plugin-slim.yml'
    }
    task.configurations = [project.configurations.runtimeClasspath]
    task.relocate 'org.bstats', "${project.group}.libs.bstats"
    task.relocate 'org.mariadb.jdbc', "${project.group}.libs.mariadb"
    task.relocate 'com.zaxxer.hikari', "${project.group}.libs.hikari"
    task.mergeServiceFiles()
}

def configureFoliaShadowVariant = { ShadowJar task, String classifier ->
    task.group = 'build'
    task.archiveClassifier.set(foliaVariantClassifier(classifier))
    task.from(sourceSets.main.output) {
        exclude 'plugin.yml'
        exclude 'plugin-slim.yml'
        rename('plugin-folia.yml', 'plugin.yml')
    }
    task.configurations = [project.configurations.runtimeClasspath]
    task.relocate 'org.bstats', "${project.group}.libs.bstats"
    task.relocate 'org.mariadb.jdbc', "${project.group}.libs.mariadb"
    task.relocate 'com.zaxxer.hikari', "${project.group}.libs.hikari"
    task.mergeServiceFiles()
}

