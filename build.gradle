def syncWebFrontend = tasks.register('syncWebFrontend', Exec) {
    group = 'build'
    description = 'Builds webshopx-web and stages it as generated plugin resources.'
    workingDir projectDir
    outputs.dir layout.buildDirectory.dir('generated-resources/main/web')
    if (project.hasProperty('frontendDir')) {
        inputs.dir(file(project.property('frontendDir')))
    }
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', file('tools/sync-web-frontend.ps1').absolutePath
    } else {
        commandLine 'pwsh', '-NoProfile',
                '-File', file('tools/sync-web-frontend.ps1').absolutePath
    }
    if (project.hasProperty('frontendDir')) {
        args '-FrontendDir', file(project.property('frontendDir')).absolutePath
    }
}

def gitText = { String... arguments ->
    providers.exec {
        commandLine(['git'] + arguments.toList())
    }.standardOutput.asText.get().trim()
}

def requireCleanSourceTree = {
    String status = gitText('status', '--porcelain=v1', '--untracked-files=all')
    if (!status.isEmpty()) {
        throw new GradleException('Release evidence requires a clean Git worktree. Commit or remove every tracked and untracked change first.')
    }
}

def frontendSourceDirectory = {
    File candidate = project.hasProperty('frontendDir')
            ? file(project.property('frontendDir'))
            : new File(rootProject.projectDir.parentFile, 'webshopx-web')
    if (!new File(candidate, '.git').exists()) {
        throw new GradleException("Frontend source is not a Git worktree: ${candidate}")
    }
    candidate.canonicalFile
}

def commandText = { File directory, List<String> command ->
    def executable = command[0]
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') && executable == 'pnpm') {
        executable = 'pnpm.cmd'
    }
    providers.exec {
        workingDir directory
        commandLine([executable] + command.drop(1))
    }.standardOutput.asText.get().trim()
}

def sha256File = { File candidate ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(candidate.bytes).encodeHex().toString()
}

def requirePinnedCleanFrontend = {
    File frontend = frontendSourceDirectory()
    String commit = commandText(frontend, ['git', 'rev-parse', 'HEAD'])
    if (commit != pinnedFrontendCommit) {
        throw new GradleException(
                "Frontend source commit mismatch. expected=${pinnedFrontendCommit}, actual=${commit}, directory=${frontend}")
    }
    String status = commandText(frontend, ['git', 'status', '--porcelain=v1', '--untracked-files=all'])
    if (!status.isEmpty()) {
        throw new GradleException("Release evidence requires a clean frontend Git worktree: ${frontend}")
    }
    frontend
}

