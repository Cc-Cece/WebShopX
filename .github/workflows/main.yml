name: Test and Release

permissions:
  contents: write 

on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 0 * * 6'

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ 21 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ matrix.java }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (Ignoring Quality Checks)
        run: ./gradlew build --info -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload build results
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }} Java ${{ matrix.java }} build results
          path: ${{ github.workspace }}/build/libs/

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }} Java ${{ matrix.java }} test results
          path: ${{ github.workspace }}/build/reports/

  release:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (Ignoring Quality Checks)
        run: ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload build results
        uses: actions/upload-artifact@v6
        with:
          name: Dev Build
          path: ${{ github.workspace }}/build/libs/
          retention-days: 14

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ github.token }} 
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev ${{ github.workspace }}/build/libs/* --clobber
          else
            gh release create dev --generate-notes --prerelease --title "Dev Build" ${{ github.workspace }}/build/libs/*
          fi