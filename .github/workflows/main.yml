name: CI, Build and Dual Release Sync

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ matrix.java }}

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test \
            -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\gradlew.bat --no-daemon clean test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build JAR Artifacts
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            BUILD_VERSION="${TAG_NAME#v}"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG_NAME=""
            BUILD_VERSION="snapshot-${SHORT_SHA}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: ${BUILD_VERSION}"

      - name: Build jars
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assemble releaseObfuscated \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Upload compiled jars
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release to Current and Mirror Repos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG_NAME: ${{ needs.build.outputs.tag_name }}
      MIRROR_REPO: Cc-Cece/WebShopX_Issues
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars
          path: dist

      - name: Publish release to current repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No JAR artifacts found under dist/."
            exit 1
          fi
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${GITHUB_REPOSITORY}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${files[@]}" \
              --title "Release ${TAG_NAME}" \
              --generate-notes
          fi

      - name: Publish release to mirror repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WebShopX-Issues_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Missing secret REPO_WebShopX-Issues_TOKEN."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No JAR artifacts found under dist/."
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${MIRROR_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${MIRROR_REPO}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${MIRROR_REPO}" --clobber
          else
            gh release create "${TAG_NAME}" "${files[@]}" \
              --repo "${MIRROR_REPO}" \
              --title "Release ${TAG_NAME}" \
              --notes "Synced from ${GITHUB_REPOSITORY} tag ${TAG_NAME}"
          fi
