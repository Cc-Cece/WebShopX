name: Test, Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*' 
  schedule:
    - cron: '0 0 * * 6'

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ 21 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ matrix.java }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (Ignoring Quality Checks)
        run: ./gradlew build --info -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }} Java ${{ matrix.java }} test results
          path: build/reports/

  build:
    name: Build and Save Artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: 21

      - name: Determine Version
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=1.1.3-SNAPSHOT+$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
          -Pversion="${{ steps.vars.outputs.version }}"

      - name: Upload compiled jars (Always)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: build/libs/
          retention-days: 14

  release:
    name: Publish Official Release
    if: startsWith(github.ref, 'refs/tags/v') 
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars
          path: build/libs/

      - name: Get Tag Name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release (Current Repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.TAG_NAME }}" build/libs/* --generate-notes --title "Release ${{ steps.tag.outputs.TAG_NAME }}"

      - name: Sync Release to Repo B
        env:
          GH_TOKEN: ${{ secrets.REPO_WebShopX_Issues_TOKEN }}
          TARGET_REPO: "Cc-Cece/WebShopX-Issues" 
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: REPO_WebShopX_Issues_TOKEN is empty. Please set it in repository secrets."
            exit 1
          fi
          echo "Syncing official release to $TARGET_REPO..."
          gh release create "${{ steps.tag.outputs.TAG_NAME }}" build/libs/* --repo "$TARGET_REPO" --generate-notes --title "Release ${{ steps.tag.outputs.TAG_NAME }}"