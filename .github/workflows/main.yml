name: CI, Build and Dual Release Sync

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ matrix.java }}

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test \
            -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\gradlew.bat --no-daemon clean test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  db-integration:
    name: DB Integration (SQLite + MySQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run SQLite/MySQL integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test \
            --tests "*SqliteSchemaScriptTest" \
            --tests "*SqliteBusinessSqlSmokeTest" \
            --tests "*SqliteConcurrencyRetryTest" \
            --tests "*MySqlBusinessSqlSmokeTest" \
            -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload integration test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-db-integration
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build JAR Artifacts
    runs-on: ubuntu-latest
    needs: [test, db-integration]
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Checkout Vue frontend
        uses: actions/checkout@v4
        with:
          repository: Cc-Cece/webshopx-vuetify-web
          ref: ${{ vars.WEBSHOPX_WEB_REF || 'main' }}
          path: .frontend/webshopx-web

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup frontend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: .frontend/webshopx-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: .frontend/webshopx-web
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG_NAME}" == v* ]]; then
              BUILD_VERSION="${TAG_NAME#v}"
              IS_PRERELEASE="false"
            else
              BUILD_VERSION="${TAG_NAME}"
              IS_PRERELEASE="true"
            fi
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG_NAME="main-latest"
            BUILD_VERSION="snapshot-${SHORT_SHA}"
            IS_PRERELEASE="true"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: ${BUILD_VERSION}"

      - name: Build plugin variants
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean packagePluginVariants \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -PtargetRuntime='1.20.6+' \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify expected 1.20.6+ artifacts
        shell: bash
        run: |
          shopt -s nullglob
          variants=(slim full full-linux full-win)
          for variant in "${variants[@]}"; do
            files=(build/libs/*-"${variant}"-1.20.6+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing 1.20.6+ artifact for variant '${variant}'."
              exit 1
            fi
          done
          folia_variants=(slim-folia full-folia full-linux-folia full-win-folia)
          for variant in "${folia_variants[@]}"; do
            files=(build/libs/*-"${variant}"-1.19.4+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing 1.19.4+ Folia artifact for variant '${variant}'."
              exit 1
            fi
          done

      - name: Collect modern artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/

      - name: Switch to JDK 25 for Minecraft 26.x
        uses: ./.github/actions/common-setup
        with:
          java-version: '25'

      - name: Build Minecraft 26.1 plugin variants
        run: |
          ./gradlew --no-daemon clean packagePluginVariants \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -PtargetRuntime='26.1+' \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify and collect 26.1 artifacts
        shell: bash
        run: |
          shopt -s nullglob
          variants=(slim full full-linux full-win slim-folia full-folia full-linux-folia full-win-folia)
          for variant in "${variants[@]}"; do
            files=(build/libs/*-"${variant}"-26.1+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing Minecraft 26.1 artifact for variant '${variant}'."
              exit 1
            fi
          done
          cp build/libs/*.jar dist/

      - name: Build Minecraft 26.2 plugin variants
        run: |
          ./gradlew --no-daemon clean packagePluginVariants \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -PtargetRuntime='26.2+' \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify and collect 26.2 artifacts
        shell: bash
        run: |
          shopt -s nullglob
          variants=(slim full full-linux full-win slim-folia full-folia full-linux-folia full-win-folia)
          for variant in "${variants[@]}"; do
            files=(build/libs/*-"${variant}"-26.2+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing Minecraft 26.2 artifact for variant '${variant}'."
              exit 1
            fi
          done
          cp build/libs/*.jar dist/

      - name: Switch to JDK 17 for legacy build
        uses: ./.github/actions/common-setup
        with:
          java-version: '17'

      - name: Build plugin variants (1.18.2+)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean packagePluginVariants \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -PtargetRuntime='1.18.2+' \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify expected 1.18.2+ artifacts
        shell: bash
        run: |
          shopt -s nullglob
          variants=(slim full full-linux full-win)
          for variant in "${variants[@]}"; do
            files=(build/libs/*-"${variant}"-1.18.2+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing 1.18.2+ artifact for variant '${variant}'."
              exit 1
            fi
          done

      - name: Collect legacy artifacts
        shell: bash
        run: |
          cp build/libs/*.jar dist/

      - name: Upload compiled jars
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release to Current and Mirror Repos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG_NAME: ${{ needs.build.outputs.tag_name }}
      IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
      MIRROR_REPO: Prism-Committee/WebShopX-Issues
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars
          path: dist
      - name: Prepare release notes
        shell: bash
        env:
          CURRENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          generate_notes() {
            local target_repo="$1"
            local output_file="$2"
          
            find_asset() {
              local variant="$1"
              local runtime="$2"
              local matches=(dist/*-"${variant}"-"${runtime}".jar)
              if (( ${#matches[@]} > 0 )); then
                basename "${matches[0]}"
              fi
            }

            link_cell() {
              local variant="$1"
              local runtime="$2"
              local file_name
              file_name="$(find_asset "${variant}" "${runtime}")"
              if [[ -n "${file_name:-}" ]]; then
                local url="https://github.com/${target_repo}/releases/download/${TAG_NAME}/${file_name}"
                printf '[%s](%s)' "$file_name" "$url"
              else
                printf '（无）'
              fi
            }
          
            {
              echo '## 版本适用与下载指引'
              echo
              echo '| 提示 | 内容 |'
              echo '| ---- | ---- |'
              echo '| 更新说明 | 具体更新内容请在 README 或 Modrinth 页面中查看 |'
              echo '| 发布页面 | [Modrinth](https://modrinth.com/plugin/webshopx)、[MineBBS](https://www.minebbs.com/resources/webshopx.15688/) |'
              echo '| Wiki | [Docusaurus](https://docs.akihito.dpdns.org/) |'
              echo
              echo '| 简写 | 说明 |'
              echo '| ---- | ---- |'
              echo '| full | 变体包含 Windows 和 Linux 所有依赖（体积较大）； |'
              echo '| slim | 变体不包含任何依赖，会在服务器启动时自动下载（需要联网环境）； |'
              echo '| full-win | 变体包含 Windows 所需依赖，不包含 Linux 相关依赖； |'
              echo '| full-linux | 变体包含 Linux 所需依赖，不包含 Windows 相关依赖； |'
              echo
              echo '| 变体 | Paper1.18.2-1.20.5 | Paper1.20.6-1.21.11 | Folia1.19.4-1.21.11 | Paper26.1 | Folia26.1 | Paper26.2+ | Folia26.2+ |'
              echo '| ---- | ---- | ---- | ---- | ---- | ---- | ---- | ---- |'
              printf '| full | %s | %s | %s | %s | %s | %s | %s |\n' \
                "$(link_cell "full" "1.18.2+")" \
                "$(link_cell "full" "1.20.6+")" \
                "$(link_cell "full-folia" "1.19.4+")" \
                "$(link_cell "full" "26.1+")" \
                "$(link_cell "full-folia" "26.1+")" \
                "$(link_cell "full" "26.2+")" \
                "$(link_cell "full-folia" "26.2+")"
              printf '| slim | %s | %s | %s | %s | %s | %s | %s |\n' \
                "$(link_cell "slim" "1.18.2+")" \
                "$(link_cell "slim" "1.20.6+")" \
                "$(link_cell "slim-folia" "1.19.4+")" \
                "$(link_cell "slim" "26.1+")" \
                "$(link_cell "slim-folia" "26.1+")" \
                "$(link_cell "slim" "26.2+")" \
                "$(link_cell "slim-folia" "26.2+")"
              printf '| full-win | %s | %s | %s | %s | %s | %s | %s |\n' \
                "$(link_cell "full-win" "1.18.2+")" \
                "$(link_cell "full-win" "1.20.6+")" \
                "$(link_cell "full-win-folia" "1.19.4+")" \
                "$(link_cell "full-win" "26.1+")" \
                "$(link_cell "full-win-folia" "26.1+")" \
                "$(link_cell "full-win" "26.2+")" \
                "$(link_cell "full-win-folia" "26.2+")"
              printf '| full-linux | %s | %s | %s | %s | %s | %s | %s |\n' \
                "$(link_cell "full-linux" "1.18.2+")" \
                "$(link_cell "full-linux" "1.20.6+")" \
                "$(link_cell "full-linux-folia" "1.19.4+")" \
                "$(link_cell "full-linux" "26.1+")" \
                "$(link_cell "full-linux-folia" "26.1+")" \
                "$(link_cell "full-linux" "26.2+")" \
                "$(link_cell "full-linux-folia" "26.2+")"
            } > "${output_file}"
          }
          
          generate_notes "${CURRENT_REPO}" "release-notes-current.md"
          generate_notes "${MIRROR_REPO}" "release-notes-mirror.md"
      - name: Publish release to current repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No JAR artifacts found under dist/."
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${GITHUB_REPOSITORY}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Pre-release ${TAG_NAME}" \
                --notes-file release-notes-current.md \
                --prerelease
            else
              gh release edit "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-current.md
            fi
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "Pre-release ${TAG_NAME}" \
                --notes-file release-notes-current.md \
                --prerelease
            else
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-current.md
            fi
          fi

      - name: Publish release to mirror repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WEBSHOPX_ISSUES_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::Missing secret REPO_WEBSHOPX_ISSUES_TOKEN, skipping mirror release publish."
            exit 0
          fi
          shopt -s nullglob
          files=(dist/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No JAR artifacts found under dist/."
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${MIRROR_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${MIRROR_REPO}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${MIRROR_REPO}" --clobber
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG_NAME}" \
                --repo "${MIRROR_REPO}" \
                --title "Pre-release ${TAG_NAME}" \
                --notes-file release-notes-mirror.md \
                --prerelease
            else
              gh release edit "${TAG_NAME}" \
                --repo "${MIRROR_REPO}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-mirror.md
            fi
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${MIRROR_REPO}" \
                --title "Pre-release ${TAG_NAME}" \
                --notes-file release-notes-mirror.md \
                --prerelease
            else
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${MIRROR_REPO}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-mirror.md
            fi
          fi

