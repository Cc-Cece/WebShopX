#             由 GitHub 标签 `${{ github.ref_name }}` 自动发布。
#             完整更新信息请查看 GitHub Release 页面：
#             https://github.com/Prism-Committee/WebShopX-Issues/releases/tag/${{ github.ref_name }}
#           game_versions: ${{ steps.cf-versions.outputs.modern_ids }}
# 
  publish-modrinth:
    name: Publish Slim Artifacts to Modrinth
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    needs: [build, release]
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      MIRROR_REPO: Prism-Committee/WebShopX-Issues
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars
          path: dist

      - name: Publish to Modrinth
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ -z "${MODRINTH_TOKEN:-}" ]]; then
            echo "::warning::Missing secret MODRINTH_TOKEN, skipping Modrinth publish."
            exit 0
          fi
          if [[ -z "${MODRINTH_PROJECT_ID:-}" ]]; then
            echo "::warning::Missing repository variable MODRINTH_PROJECT_ID, skipping Modrinth publish."
            exit 0
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG_NAME}" == v* ]]; then
            BASE_VERSION="${TAG_NAME#v}"
            VERSION_TYPE="release"
          else
            BASE_VERSION="${TAG_NAME}"
            VERSION_TYPE="beta"
          fi

          paper_legacy=(dist/*-slim-1.18.2+.jar)
          paper_modern=(dist/*-slim-1.20.6+.jar)
          folia=(dist/*-slim-folia-1.19.4+.jar)
          paper_261=(dist/*-slim-26.1+.jar)
          folia_261=(dist/*-slim-folia-26.1+.jar)
          paper_26=(dist/*-slim-26.2+.jar)
          folia_26=(dist/*-slim-folia-26.2+.jar)

          if (( ${#paper_legacy[@]} == 0 || ${#paper_modern[@]} == 0 || ${#folia[@]} == 0 || ${#paper_261[@]} == 0 || ${#folia_261[@]} == 0 || ${#paper_26[@]} == 0 || ${#folia_26[@]} == 0 )); then
            echo "::error::Missing one or more slim artifacts required for Modrinth publish."
            exit 1
          fi

          find_asset() {
            local variant="$1"
            local runtime="$2"
            local matches=(dist/*-"${variant}"-"${runtime}".jar)
            if (( ${#matches[@]} > 0 )); then
              basename "${matches[0]}"
            fi
          }

          link_cell() {
            local variant="$1"
            local runtime="$2"
            local file_name
            file_name="$(find_asset "${variant}" "${runtime}")"
            if [[ -n "${file_name:-}" ]]; then
              local url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${file_name}"
              printf '[%s](%s)' "$file_name" "$url"
            else
              printf '（无）'
            fi
          }

          generate_modrinth_changelog() {
            cat <<EOF
          由 GitHub 标签 \`${TAG_NAME}\` 自动发布。

          完整更新信息请查看 GitHub Release 页面：
          https://github.com/${MIRROR_REPO}/releases/tag/${TAG_NAME}

          | 变体 | Paper1.18.2-1.20.5 | Paper1.20.6-1.21.11 | Folia1.19.4-1.21.11 | Paper26.1 | Folia26.1 | Paper26.2+ | Folia26.2+ |
          | ---- | ---- | ---- | ---- | ---- | ---- | ---- | ---- |
          | full | $(link_cell "full" "1.18.2+") | $(link_cell "full" "1.20.6+") | $(link_cell "full-folia" "1.19.4+") | $(link_cell "full" "26.1+") | $(link_cell "full-folia" "26.1+") | $(link_cell "full" "26.2+") | $(link_cell "full-folia" "26.2+") |
          | slim | $(link_cell "slim" "1.18.2+") | $(link_cell "slim" "1.20.6+") | $(link_cell "slim-folia" "1.19.4+") | $(link_cell "slim" "26.1+") | $(link_cell "slim-folia" "26.1+") | $(link_cell "slim" "26.2+") | $(link_cell "slim-folia" "26.2+") |
          | full-win | $(link_cell "full-win" "1.18.2+") | $(link_cell "full-win" "1.20.6+") | $(link_cell "full-win-folia" "1.19.4+") | $(link_cell "full-win" "26.1+") | $(link_cell "full-win-folia" "26.1+") | $(link_cell "full-win" "26.2+") | $(link_cell "full-win-folia" "26.2+") |
          | full-linux | $(link_cell "full-linux" "1.18.2+") | $(link_cell "full-linux" "1.20.6+") | $(link_cell "full-linux-folia" "1.19.4+") | $(link_cell "full-linux" "26.1+") | $(link_cell "full-linux-folia" "26.1+") | $(link_cell "full-linux" "26.2+") | $(link_cell "full-linux-folia" "26.2+") |
          EOF
          }

          publish_modrinth() {
            local file="$1"
            local flavor="$2"
            local loaders_json="$3"
            local min_game_version="$4"
            local max_game_version="${5:-}"
            local version_suffix="${6:-}"
            local version_number="${BASE_VERSION}${version_suffix}"
            local version_title="${BASE_VERSION} (${flavor})"
            local changelog
            changelog="$(generate_modrinth_changelog)"

            local game_versions_json
            game_versions_json=$(
              curl -sSf "https://api.modrinth.com/v2/tag/game_version" \
                | jq -c --arg minv "${min_game_version}" --arg maxv "${max_game_version}" '
                    def semver: split(".") | map(tonumber);
                    def ge($a; $b):
                      ($a[0] > $b[0]) or
                      ($a[0] == $b[0] and $a[1] > $b[1]) or
                      ($a[0] == $b[0] and $a[1] == $b[1] and ($a[2] // 0) >= ($b[2] // 0));
                    def le($a; $b):
                      ($a[0] < $b[0]) or
                      ($a[0] == $b[0] and $a[1] < $b[1]) or
                      ($a[0] == $b[0] and $a[1] == $b[1] and ($a[2] // 0) <= ($b[2] // 0));
                    [ .[]
                      | select(.version_type == "release")
                      | .version
                      | select(test("^\\d+\\.\\d+(\\.\\d+)?$"))
                      | select(ge((semver + [0,0])[0:3]; (($minv | semver) + [0,0])[0:3]))
                      | select(
                          ($maxv == "") or
                          le((semver + [0,0])[0:3]; (($maxv | semver) + [0,0])[0:3])
                        )
                    ]
                    | unique
                    | sort_by(split(".") | map(tonumber))
                  '
            )

            local payload
            payload=$(
              jq -cn \
                --arg project_id "${MODRINTH_PROJECT_ID}" \
                --arg version_number "${version_number}" \
                --arg version_title "${version_title}" \
                --arg changelog "${changelog}" \
                --arg version_type "${VERSION_TYPE}" \
                --argjson loaders "${loaders_json}" \
                --argjson game_versions "${game_versions_json}" \
                '{
                  project_id: $project_id,
                  version_number: $version_number,
                  name: $version_title,
                  changelog: $changelog,
                  version_type: $version_type,
                  loaders: $loaders,
                  game_versions: $game_versions,
                  dependencies: [],
                  featured: false,
                  status: "listed",
                  file_parts: ["file"]
                }'
            )

            echo "Uploading ${file} as ${version_number} (${VERSION_TYPE}) ..."
            local response_file
            response_file="$(mktemp)"
            local http_code
            http_code=$(
              curl -sS -o "${response_file}" -w "%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "User-Agent: ${GITHUB_REPOSITORY}/actions" \
              -F "data=${payload}" \
              -F "file=@${file};type=application/java-archive"
            )
            if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
              echo "::error::Modrinth upload failed with HTTP ${http_code} for ${version_number}."
              cat "${response_file}"
              rm -f "${response_file}"
              return 1
            fi
            rm -f "${response_file}"
          }

          # Upload order matters for display/primary file preference.
          publish_modrinth "${folia[0]}" "folia-1.19.4-slim" '["folia"]' "1.19.4" "1.21.11" ""
          publish_modrinth "${paper_legacy[0]}" "paper-1.18.2-slim" '["paper","purpur","spigot","bukkit"]' "1.18.2" "1.20.5" "-p182"
          publish_modrinth "${paper_modern[0]}" "paper-1.20.6-slim" '["paper","purpur","spigot","bukkit"]' "1.20.6" "1.21.11" "-p206"
          publish_modrinth "${folia_261[0]}" "folia-26.1-slim" '["folia"]' "26.1" "26.1.99" "-f261"
          publish_modrinth "${paper_261[0]}" "paper-26.1-slim" '["paper"]' "26.1" "26.1.99" "-p261"
          publish_modrinth "${folia_26[0]}" "folia-26.2-slim" '["folia"]' "26.2" "" "-f262"
          publish_modrinth "${paper_26[0]}" "paper-26.2-slim" '["paper"]' "26.2" "" "-p262"
