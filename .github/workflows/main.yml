name: CI, Build and Dual Release Sync

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ matrix.java }}

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test \
            -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\gradlew.bat --no-daemon clean test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  db-integration:
    name: DB Integration (SQLite + MySQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run SQLite/MySQL integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test \
            --tests "*SqliteSchemaScriptTest" \
            --tests "*SqliteBusinessSqlSmokeTest" \
            --tests "*SqliteConcurrencyRetryTest" \
            --tests "*MySqlBusinessSqlSmokeTest" \
            -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload integration test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-db-integration
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build JAR Artifacts
    runs-on: ubuntu-latest
    needs: [test, db-integration]
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            BUILD_VERSION="${TAG_NAME#v}"
            IS_PRERELEASE="false"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG_NAME="main-latest"
            BUILD_VERSION="snapshot-${SHORT_SHA}"
            IS_PRERELEASE="true"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: ${BUILD_VERSION}"

      - name: Build plugin variants
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean packagePluginVariants \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -PtargetRuntime='1.20.6+' \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify expected 1.20.6+ artifacts
        shell: bash
        run: |
          shopt -s nullglob
          variants=(slim full full-linux full-win slim-folia full-folia full-linux-folia full-win-folia)
          for variant in "${variants[@]}"; do
            files=(build/libs/*-"${variant}"-1.20.6+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing 1.20.6+ artifact for variant '${variant}'."
              exit 1
            fi
          done

      - name: Collect modern artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/

      - name: Switch to JDK 17 for legacy build
        uses: ./.github/actions/common-setup
        with:
          java-version: '17'

      - name: Build plugin variants (1.18.2+)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean packagePluginVariants \
            -x test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest \
            -PtargetRuntime='1.18.2+' \
            -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify expected 1.18.2+ artifacts
        shell: bash
        run: |
          shopt -s nullglob
          variants=(slim full full-linux full-win slim-folia full-folia full-linux-folia full-win-folia)
          for variant in "${variants[@]}"; do
            files=(build/libs/*-"${variant}"-1.18.2+.jar)
            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing 1.18.2+ artifact for variant '${variant}'."
              exit 1
            fi
          done

      - name: Collect legacy artifacts
        shell: bash
        run: |
          cp build/libs/*.jar dist/

      - name: Upload compiled jars
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release to Current and Mirror Repos
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG_NAME: ${{ needs.build.outputs.tag_name }}
      IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
      MIRROR_REPO: Cc-Cece/WebShopX_Issues
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars
          path: dist
      - name: Prepare release notes
        shell: bash
        env:
          CURRENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          generate_notes() {
            local target_repo="$1"
            local output_file="$2"
          
            find_asset() {
              local variant="$1"
              local runtime="$2"
              local matches=(dist/*-"${variant}"-"${runtime}".jar)
              if (( ${#matches[@]} > 0 )); then
                basename "${matches[0]}"
              fi
            }
          
            row() {
              local runtime="$1"
              local java="$2"
              local server="$3"
              local variant="$4"
              local note="$5"
              local file_name
              file_name="$(find_asset "${variant}" "${runtime}")"
              if [[ -n "${file_name:-}" ]]; then
                local url="https://github.com/${target_repo}/releases/download/${TAG_NAME}/${file_name}"
                printf '| `%s` | %s | %s | `%s` | [%s](%s) | %s |\n' \
                  "$runtime" "$java" "$server" "$variant" "$file_name" "$url" "$note"
              else
                printf '| `%s` | %s | %s | `%s` | （未找到） | %s |\n' \
                  "$runtime" "$java" "$server" "$variant" "$note"
              fi
            }
          
            {
              echo '## 版本适用与下载指引'
              echo
              echo '| 运行时目标 | Java | 服务端类型 | 变体 | 文件下载（本次 Release） | 适用说明 |'
              echo '| --- | --- | --- | --- | --- | --- |'
              row "1.20.6+" "21" "Paper" "full" "默认推荐"
              row "1.20.6+" "21" "Paper" "full-linux" "Linux 服务器（SQLite Native 精简）"
              row "1.20.6+" "21" "Paper" "full-win" "Windows 服务器（SQLite Native 精简）"
              row "1.20.6+" "21" "Paper" "slim" "仅在外部已提供依赖时使用"
              row "1.20.6+" "21" "Folia" "full-folia" "Folia 默认推荐"
              row "1.20.6+" "21" "Folia" "full-linux-folia" "Folia Linux"
              row "1.20.6+" "21" "Folia" "full-win-folia" "Folia Windows"
              row "1.20.6+" "21" "Folia" "slim-folia" "Folia + 外部依赖场景"
              row "1.18.2+" "17" "Paper" "full" "低版本默认推荐"
              row "1.18.2+" "17" "Paper" "full-linux" "低版本 Linux"
              row "1.18.2+" "17" "Paper" "full-win" "低版本 Windows"
              row "1.18.2+" "17" "Paper" "slim" "低版本外部依赖场景"
              row "1.18.2+" "17" "Folia" "full-folia" "低版本 Folia 默认推荐"
              row "1.18.2+" "17" "Folia" "full-linux-folia" "低版本 Folia Linux"
              row "1.18.2+" "17" "Folia" "full-win-folia" "低版本 Folia Windows"
              row "1.18.2+" "17" "Folia" "slim-folia" "低版本 Folia + 外部依赖场景"
            } > "${output_file}"
          }
          
          generate_notes "${CURRENT_REPO}" "release-notes-current.md"
          generate_notes "${MIRROR_REPO}" "release-notes-mirror.md"
      - name: Publish release to current repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No JAR artifacts found under dist/."
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${GITHUB_REPOSITORY}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Main Snapshot (${TAG_NAME})" \
                --notes-file release-notes-current.md \
                --prerelease
            else
              gh release edit "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-current.md
            fi
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "Main Snapshot (${TAG_NAME})" \
                --notes-file release-notes-current.md \
                --prerelease
            else
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-current.md
            fi
          fi

      - name: Publish release to mirror repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WebShopX_Issues_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::Missing secret REPO_WebShopX_Issues_TOKEN, skipping mirror release publish."
            exit 0
          fi
          shopt -s nullglob
          files=(dist/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No JAR artifacts found under dist/."
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${MIRROR_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${MIRROR_REPO}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${MIRROR_REPO}" --clobber
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG_NAME}" \
                --repo "${MIRROR_REPO}" \
                --title "Main Snapshot (${TAG_NAME})" \
                --notes-file release-notes-mirror.md \
                --prerelease
            else
              gh release edit "${TAG_NAME}" \
                --repo "${MIRROR_REPO}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-mirror.md
            fi
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${MIRROR_REPO}" \
                --target "${GITHUB_SHA}" \
                --title "Main Snapshot (${TAG_NAME})" \
                --notes-file release-notes-mirror.md \
                --prerelease
            else
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${MIRROR_REPO}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes-mirror.md
            fi
          fi
