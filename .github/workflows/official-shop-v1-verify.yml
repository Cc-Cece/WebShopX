name: Official Shop Inventory V1 Verify

on:
  push:
    branches:
      - agent/official-shop-inventory-v1
  pull_request:
    branches:
      - feat/webshopx-inventory-management
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        shell: bash
        run: |
          set +e
          ./gradlew compileJava test --no-daemon -PtargetRuntime=1.20.6+ > build.log 2>&1
          code=$?
          tail -n 220 build.log
          exit $code
