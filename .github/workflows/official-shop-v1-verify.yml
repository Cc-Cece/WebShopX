name: Official Shop Inventory V1 Verify

on:
  push:
    branches:
      - agent/official-shop-inventory-v1
  pull_request:
    branches:
      - feat/webshopx-inventory-management
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        id: compile
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew compileJava test --no-daemon -PtargetRuntime=1.20.6+ > build.log 2>&1
          code=$?
          tail -n 220 build.log
          exit $code
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-shop-v1-build-log
          path: build.log
          if-no-files-found: error
