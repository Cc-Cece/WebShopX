name: Official Shop Inventory V1 Verify

on:
  push:
    branches:
      - agent/official-shop-inventory-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: ./gradlew compileJava test --no-daemon -PtargetRuntime=1.20.6+
