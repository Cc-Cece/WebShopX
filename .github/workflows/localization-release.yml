name: Localization Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "本地化资源的 GitHub 发布标签（例如：l10n-cdn）"
        required: false
        default: "l10n-cdn"
      target_repo:
        description: "本地化 CDN 资源的目标仓库（owner/name）"
        required: false
        default: "Cc-Cece/WebShopX-Issues"
      manifest_version:
        description: "可选的 manifest 版本号（例如：l10n-2026.05.09-01）"
        required: false
        default: ""
      pull_from_crowdin:
        description: "打包前从 Crowdin 拉取最新翻译"
        required: false
        default: true
        type: boolean
      crowdin_branch:
        description: "要导出的 Crowdin 分支（可选，留空则使用 Crowdin 默认分支）"
        required: false
        default: ""
      crowdin_export_only_approved:
        description: "仅导出 Crowdin 中已审批的翻译"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-l10n:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: ${{ inputs.target_repo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Crowdin secrets (when enabled)
        if: ${{ inputs.pull_from_crowdin }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.CROWDIN_PROJECT_ID || vars.CROWDIN_PROJECT_ID }}" ]]; then
            echo "::error::Missing Crowdin project id. Configure either secret CROWDIN_PROJECT_ID or variable CROWDIN_PROJECT_ID."
            exit 1
          fi
          if [[ -z "${{ secrets.CROWDIN_PERSONAL_TOKEN }}" ]]; then
            echo "::error::Missing secret CROWDIN_PERSONAL_TOKEN."
            exit 1
          fi

      - name: Pull translations from Crowdin API (optional)
        if: ${{ inputs.pull_from_crowdin }}
        shell: bash
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID || vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_BRANCH: ${{ inputs.crowdin_branch }}
          CROWDIN_EXPORT_ONLY_APPROVED: ${{ inputs.crowdin_export_only_approved }}
        run: |
          set -euo pipefail

          API_BASE="https://api.crowdin.com/api/v2"
          AUTH_HEADER="Authorization: Bearer ${CROWDIN_PERSONAL_TOKEN}"
          PROJECT_ID="${CROWDIN_PROJECT_ID}"
          BRANCH_ID=""

          if [[ -n "${CROWDIN_BRANCH}" ]]; then
            echo "Resolving Crowdin branch id for '${CROWDIN_BRANCH}'..."
            branch_json="$(curl -fsSL \
              -H "${AUTH_HEADER}" \
              "${API_BASE}/projects/${PROJECT_ID}/branches?limit=500")"
            BRANCH_ID="$(echo "${branch_json}" | jq -r --arg name "${CROWDIN_BRANCH}" '.data[] | select(.data.name == $name) | .data.id' | head -n1)"
            if [[ -z "${BRANCH_ID}" || "${BRANCH_ID}" == "null" ]]; then
              echo "::error::Crowdin branch '${CROWDIN_BRANCH}' not found in project ${PROJECT_ID}."
              exit 1
            fi
          fi

          request_payload="$(jq -n \
            --argjson approved "${CROWDIN_EXPORT_ONLY_APPROVED}" \
            --arg branch_id "${BRANCH_ID}" \
            '{
              exportApprovedOnly: $approved
            } + (if $approved then { skipUntranslatedFiles: true } else {} end)
              + (if ($branch_id != "") then { branchId: ($branch_id|tonumber) } else {} end)')"

          echo "Triggering Crowdin build..."
          build_response_file="$(mktemp)"
          build_http_code="$(
            curl -sS -o "${build_response_file}" -w "%{http_code}" -X POST \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/json" \
              -d "${request_payload}" \
              "${API_BASE}/projects/${PROJECT_ID}/translations/builds"
          )"
          if [[ "${build_http_code}" -lt 200 || "${build_http_code}" -ge 300 ]]; then
            echo "::error::Crowdin build create failed with HTTP ${build_http_code}."
            cat "${build_response_file}"
            exit 1
          fi
          build_json="$(cat "${build_response_file}")"

          build_id="$(echo "${build_json}" | jq -r '.data.id')"
          if [[ -z "${build_id}" || "${build_id}" == "null" ]]; then
            echo "::error::Failed to create Crowdin translation build."
            echo "${build_json}"
            exit 1
          fi
          echo "Crowdin build id: ${build_id}"

          echo "Polling Crowdin build status..."
          status=""
          for _ in $(seq 1 60); do
            status_json="$(curl -fsSL \
              -H "${AUTH_HEADER}" \
              "${API_BASE}/projects/${PROJECT_ID}/translations/builds/${build_id}")"
            status="$(echo "${status_json}" | jq -r '.data.status')"
            if [[ "${status}" == "finished" ]]; then
              break
            fi
            if [[ "${status}" == "failed" || "${status}" == "canceled" ]]; then
              echo "::error::Crowdin build ended with status '${status}'."
              echo "${status_json}"
              exit 1
            fi
            sleep 5
          done

          if [[ "${status}" != "finished" ]]; then
            echo "::error::Crowdin build did not finish in time."
            exit 1
          fi

          echo "Requesting download URL..."
          download_json="$(curl -fsSL \
            -H "${AUTH_HEADER}" \
            "${API_BASE}/projects/${PROJECT_ID}/translations/builds/${build_id}/download")"
          download_url="$(echo "${download_json}" | jq -r '.data.url')"
          if [[ -z "${download_url}" || "${download_url}" == "null" ]]; then
            echo "::error::Failed to get Crowdin download URL."
            echo "${download_json}"
            exit 1
          fi

          rm -rf crowdin-download crowdin-download.zip
          echo "Downloading archive..."
          curl -fsSL -o crowdin-download.zip "${download_url}"
          mkdir -p crowdin-download
          unzip -q crowdin-download.zip -d crowdin-download
          echo "Crowdin archive extracted to crowdin-download/"

      - name: Normalize downloaded Crowdin files (optional)
        if: ${{ inputs.pull_from_crowdin }}
        shell: bash
        run: |
          set -euo pipefail

          copied=0
          while IFS= read -r -d '' source_file; do
            lang_dir="$(echo "${source_file}" | cut -d/ -f2)"
            locale="${lang_dir}"
            target="src/main/resources/messages/messages.${locale}.yml"
            mkdir -p "$(dirname "${target}")"
            cp -f "${source_file}" "${target}"
            copied=$((copied + 1))
          done < <(find crowdin-download -type f -path 'crowdin-download/*/messages/messages.en-US.yml' -print0)

          while IFS= read -r -d '' source_file; do
            lang_dir="$(echo "${source_file}" | cut -d/ -f2)"
            locale="${lang_dir}"
            namespace="$(echo "${source_file}" | sed -E 's#^crowdin-download/[^/]+/web/i18n/([^/]+)/en-US\.json$#\1#')"
            target="src/main/resources/web/i18n/${namespace}/${locale}.json"
            mkdir -p "$(dirname "${target}")"
            cp -f "${source_file}" "${target}"
            copied=$((copied + 1))
          done < <(find crowdin-download -type f -path 'crowdin-download/*/web/i18n/*/en-US.json' -print0)

          if [[ "${copied}" -eq 0 ]]; then
            echo "::error::No translated files were normalized from Crowdin output."
            find crowdin-download -maxdepth 4 -type f | sort || true
            exit 1
          else
            echo "Normalized ${copied} translated files."
          fi

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          TAG="$(echo "${TAG}" | xargs)"
          if [[ -z "${TAG}" ]]; then
            TAG="l10n-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved l10n tag: ${TAG}"

      - name: Build locale zips and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_l10n_release.py \
            --repo "${TARGET_REPO}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --version "${{ inputs.manifest_version }}" \
            --default-locale "zh-CN" \
            --output-dir "dist/l10n"

      - name: Publish localization release to mirror repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WEBSHOPX_ISSUES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing secret REPO_WEBSHOPX_ISSUES_TOKEN."
            exit 1
          fi
          shopt -s nullglob
          TAG="${{ steps.tag.outputs.tag }}"
          files=(dist/l10n/manifest.json dist/l10n/*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No localization assets were generated."
            exit 1
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "Localization assets for WebShopX."
            echo
            echo "Entry URL:"
            echo "- https://github.com/${TARGET_REPO}/releases/download/${TAG}/manifest.json"
            echo
            echo "Included assets:"
            for f in "${files[@]}"; do
              echo "- $(basename "${f}")"
            done
          } > "${NOTES_FILE}"

          if gh release view "${TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${TARGET_REPO}, updating assets..."
            gh release upload "${TAG}" "${files[@]}" --repo "${TARGET_REPO}" --clobber
            gh release edit "${TAG}" \
              --repo "${TARGET_REPO}" \
              --title "Localization ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --prerelease
          else
            gh release create "${TAG}" "${files[@]}" \
              --repo "${TARGET_REPO}" \
              --title "Localization ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --prerelease \
              --latest=false
          fi
