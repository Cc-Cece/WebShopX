name: I18n Quality Gate

on:
  pull_request:
    branches: [ "feat/webshopx-inventory-management", "main" ]

permissions:
  contents: read

jobs:
  validate-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit Java hardcoded CJK
        run: python tools/i18n-java-audit.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile plugin
        run: |
          chmod +x gradlew
          ./gradlew compileJava

      - name: Validate bundled locale resources
        id: locale_test
        shell: bash
        run: |
          set +e
          ./gradlew test --tests com.webshopx.MessageBundleYamlTest
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload locale test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-locale-test-diagnostics
          path: |
            build/test-results/test
            src/main/resources/messages/messages.zh-CN.yml
            src/main/resources/messages/messages.en-US.yml
          if-no-files-found: error

      - name: Enforce locale validation
        if: steps.locale_test.outputs.status != '0'
        run: exit 1
