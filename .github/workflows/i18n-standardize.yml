name: I18n Backend Locale Repair

on:
  pull_request:
    branches: [ "feat/webshopx-inventory-management" ]

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Add missing English market locale entries
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/resources/messages/messages.en-US.yml')
          text = path.read_text(encoding='utf-8')

          enum_anchor = '''  market_mode:\n    manual: "Manual Listing"\n    supply: "Supply"\n'''
          enum_block = '''  market_mode:\n    manual: "Manual Listing"\n    supply: "Supply"\n  market:\n    side:\n      SELL: "Sell Order"\n      BUY: "Buy Order"\n  market_side:\n    sell: "Sell Order"\n    buy: "Buy Order"\n'''
          if 'enum:\n' in text and '      SELL: "Sell Order"' not in text:
              if enum_anchor not in text:
                  raise SystemExit('enum insertion anchor not found')
              text = text.replace(enum_anchor, enum_block, 1)

          error_anchor = '''    listing_empty: "This listing has no stock to resume."\n    listing_limit: "You have reached the active listing limit."\n'''
          error_block = '''    listing_empty: "This listing has no stock to resume."\n    listing_limit: "You have reached the active listing limit."\n    buy_requires_direct_mode: "Buy orders only support fixed-price direct trading."\n    buy_requires_manual_source: "Buy orders only support manual item sources."\n    buy_requires_fixed_price: "Buy orders cannot change price or enable dynamic pricing after creation."\n    buy_escrow_insufficient: "The buy-order escrow balance is insufficient to complete this fulfillment."\n    buy_order_not_active: "This buy order is not currently accepting fulfillment."\n    cannot_fulfill_own_buy_order: "You cannot fulfill your own buy order."\n    fulfill_item_not_match: "The delivered item does not match the buy-order template."\n    invalid_market_side: "Invalid listing side. Only SELL or BUY is supported."\n    invalid_tag: "This category tag is invalid or not allowed."\n    tag_disabled: "This category tag is disabled."\n    limitation_item_forbidden: "This item does not satisfy the listing rules."\n    limitation_currency_not_allowed: "This currency is not allowed for the listing."\n    limitation_trade_mode_not_allowed: "This trade mode is not allowed for the listing."\n    limitation_side_not_allowed: "This listing side is not allowed."\n'''
          if '    buy_requires_direct_mode:' not in text:
              if error_anchor not in text:
                  raise SystemExit('market error insertion anchor not found')
              text = text.replace(error_anchor, error_block, 1)

          path.write_text(text, encoding='utf-8')

      - name: Audit Java hardcoded CJK
        run: python tools/i18n-java-audit.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and validate locale bundles
        run: |
          chmod +x gradlew
          ./gradlew compileJava
          ./gradlew test --tests com.webshopx.MessageBundleYamlTest
          git diff --check

      - name: Commit repaired locale bundle
        run: |
          if git diff --quiet -- src/main/resources/messages/messages.en-US.yml; then
            echo "Locale bundle already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/messages/messages.en-US.yml
          git commit -m "fix: synchronize backend English market locale"
          git push origin HEAD:${{ github.head_ref }}
