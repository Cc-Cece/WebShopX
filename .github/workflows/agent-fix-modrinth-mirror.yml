name: One-shot Modrinth mirror link fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  TAG_NAME: snapshot-3.2.3

jobs:
  apply-and-tag:
    if: github.event.issue.title == '[agent] trigger snapshot-3.2.3-pat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply exact Modrinth mirror link fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/main.yml')
          data = p.read_bytes()
          old = b'local url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${file_name}"'
          new = b'local url="https://github.com/${MIRROR_REPO}/releases/download/${TAG_NAME}/${file_name}"'
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Modrinth private-repo link expression, found {count}')
          p.write_bytes(data.replace(old, new, 1))
          PY
          git rm .github/workflows/agent-fix-modrinth-mirror.yml

      - name: Commit and push main with release PAT
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.REPO_WEBSHOPX_ISSUES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_PAT:-}" ]]; then
            echo "REPO_WEBSHOPX_ISSUES_TOKEN is empty" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main.yml
          git commit -m "fix: point Modrinth downloads to public release mirror"
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Create and push snapshot tag with release PAT
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists; refusing to overwrite." >&2
            exit 1
          fi
          git tag "${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Close trigger issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --comment "PAT-backed snapshot trigger processed."
