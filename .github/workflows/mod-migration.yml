name: Mod migration gates

on:
  pull_request:
    paths:
      - 'webshopx-**'
      - 'gradle/mod-platform.gradle'
      - 'docs/mod-migration/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/mod-migration.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: mod-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Cc-Cece/webshopx-vuetify-web
          ref: f655cee059b85ec3b99eae4f3125fe262773edbd
          path: .frontend/webshopx-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .frontend/webshopx-web/pnpm-lock.yaml
      - name: Install pinned frontend dependencies
        working-directory: .frontend/webshopx-web
        run: pnpm install --frozen-lockfile
      - name: Install pinned automated player dependencies
        working-directory: docs/mod-migration/tools/minecraft-client
        run: npm ci --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=moderate
      - name: Install Java 17 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Java 21 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Java 25 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run platform-neutral and Loader gates
        run: ./gradlew localReadiness --stacktrace
      - name: Scan candidate filesystem and bundled dependencies
        id: dependency-scan
        uses: anchore/scan-action@v7
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - name: Upload dependency scan
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.dependency-scan.outputs.sarif }}
      - name: Freeze contracts and scan evidence
        shell: pwsh
        run: |
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'contracts-and-artifacts' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/java-17+21+25' `
            -EvidencePath @('build/reports/mod-migration','webshopx-core/build/reports/tests/test') `
            -OutputFile 'build/required-checks/contracts-and-artifacts.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'dependency-scan' -SourceCommit '${{ github.sha }}' `
            -Environment 'anchore-scan-action-v7/grype-high' `
            -EvidencePath @('${{ steps.dependency-scan.outputs.sarif }}') `
            -OutputFile 'build/required-checks/dependency-scan.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'security-scan' -SourceCommit '${{ github.sha }}' `
            -Environment 'anchore-scan-action-v7/grype-high' `
            -EvidencePath @('${{ steps.dependency-scan.outputs.sarif }}') `
            -OutputFile 'build/required-checks/security-scan.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'license-scan' -SourceCommit '${{ github.sha }}' `
            -Environment 'gradle-verifyModSbom/SPDX-2.3' `
            -EvidencePath @('build/reports/mod-migration/mod-sbom.spdx.json') `
            -OutputFile 'build/required-checks/license-scan.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'sbom-validate' -SourceCommit '${{ github.sha }}' `
            -Environment 'gradle-verifyModSbom/SPDX-2.3' `
            -EvidencePath @('build/reports/mod-migration/mod-sbom.spdx.json','build/reports/mod-migration/release-manifest.json') `
            -OutputFile 'build/required-checks/sbom-validate.check.json'
      - name: Upload contracts and scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: contracts-evidence-${{ github.sha }}
          if-no-files-found: error
          path: build/required-checks/*.check.json
      - name: Upload candidate matrix
        uses: actions/upload-artifact@v4
        with:
          name: webshopx-mod-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            webshopx-*/build/libs/*.jar
            build/reports/mod-migration/release-manifest.json
            build/reports/mod-migration/mod-sbom.spdx.json
            build/reports/mod-migration/readiness.json
            webshopx-core/build/reports/mod-migration/performance-budget.json

  paper-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Preserve Paper baseline
        run: ./gradlew paperBaseline --stacktrace
      - name: Freeze Paper evidence
        shell: pwsh
        run: >-
          & docs/mod-migration/tools/write-check-evidence.ps1
          -Id 'paper-regression' -SourceCommit '${{ github.sha }}'
          -Environment 'ubuntu-latest/java-21'
          -EvidencePath @('build/test-results/test','build/tmp/plain-plugin')
          -OutputFile 'build/required-checks/paper-regression.check.json'
      - uses: actions/upload-artifact@v4
        with:
          name: paper-evidence-${{ github.sha }}
          if-no-files-found: error
          path: build/required-checks/*.check.json

  database-and-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: webshopx_it
          MARIADB_USER: webshopx_it
          MARIADB_PASSWORD: integration-secret
          MARIADB_ROOT_PASSWORD: root-integration-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Redis executable for restart injection
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
          sudo systemctl stop redis-server || true
      - name: Exercise MariaDB cluster and Redis recovery
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dwebshopx.database.integration=true
            -Dwebshopx.database.type=mariadb
            -Dwebshopx.database.host=127.0.0.1
            -Dwebshopx.database.port=3306
            -Dwebshopx.database.schema=webshopx_it
            -Dwebshopx.database.user=webshopx_it
            -Dwebshopx.database.password=integration-secret
            -Dwebshopx.redis.integration=true
            -Dwebshopx.redis.port=6379
            -Dwebshopx.redis.reconnect.integration=true
            -Dwebshopx.redis.reconnect.port=26380
        run: >-
          ./gradlew :webshopx-core:test
          --tests com.webshopx.MariaDbCommerceIntegrationTest
          --tests com.webshopx.core.RedisEventBridgeIntegrationTest
          --tests com.webshopx.core.RedisReconnectIntegrationTest
          --rerun-tasks --stacktrace
      - name: Freeze MariaDB and Redis evidence
        shell: pwsh
        run: |
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'database-mariadb' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/mariadb-11.4/java-25' `
            -EvidencePath @('webshopx-core/build/test-results/test/TEST-com.webshopx.MariaDbCommerceIntegrationTest.xml') `
            -OutputFile 'build/required-checks/database-mariadb.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'redis-relay' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/redis-7/java-25' `
            -EvidencePath @('webshopx-core/build/test-results/test/TEST-com.webshopx.core.RedisEventBridgeIntegrationTest.xml','webshopx-core/build/test-results/test/TEST-com.webshopx.core.RedisReconnectIntegrationTest.xml') `
            -OutputFile 'build/required-checks/redis-relay.check.json'
      - uses: actions/upload-artifact@v4
        with:
          name: database-redis-check-evidence-${{ github.sha }}
          if-no-files-found: error
          path: build/required-checks/*.check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-redis-evidence-${{ github.sha }}
          if-no-files-found: error
          path: webshopx-core/build/reports/tests/test

  database-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: webshopx_it
          MYSQL_USER: webshopx_it
          MYSQL_PASSWORD: integration-secret
          MYSQL_ROOT_PASSWORD: root-integration-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=root-integration-secret"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Exercise MySQL shared-node transactions
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dwebshopx.database.integration=true
            -Dwebshopx.database.type=mysql
            -Dwebshopx.database.host=127.0.0.1
            -Dwebshopx.database.port=3306
            -Dwebshopx.database.schema=webshopx_it
            -Dwebshopx.database.user=webshopx_it
            -Dwebshopx.database.password=integration-secret
        run: >-
          ./gradlew :webshopx-core:test
          --tests com.webshopx.MariaDbCommerceIntegrationTest
          --rerun-tasks --stacktrace
      - name: Freeze MySQL evidence
        shell: pwsh
        run: >-
          & docs/mod-migration/tools/write-check-evidence.ps1
          -Id 'database-mysql' -SourceCommit '${{ github.sha }}'
          -Environment 'ubuntu-latest/mysql-8.4/java-25'
          -EvidencePath @('webshopx-core/build/test-results/test/TEST-com.webshopx.MariaDbCommerceIntegrationTest.xml')
          -OutputFile 'build/required-checks/database-mysql.check.json'
      - uses: actions/upload-artifact@v4
        with:
          name: database-mysql-check-evidence-${{ github.sha }}
          if-no-files-found: error
          path: build/required-checks/*.check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-mysql-evidence-${{ github.sha }}
          if-no-files-found: error
          path: webshopx-core/build/reports/tests/test

  dedicated-server-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: fabric, minecraft: '1.18.2', loader: '0.19.3', java: 17, project: webshopx-fabric-1182, fabricApi: '0.77.0+1.18.2' }
          - { platform: fabric, minecraft: '1.19.4', loader: '0.19.3', java: 17, project: webshopx-fabric-1182, fabricApi: '0.87.2+1.19.4' }
          - { platform: fabric, minecraft: '1.20', loader: '0.19.3', java: 17, project: webshopx-fabric-1201, fabricApi: '0.83.0+1.20' }
          - { platform: fabric, minecraft: '1.20.4', loader: '0.19.3', java: 17, project: webshopx-fabric-1201, fabricApi: '0.97.3+1.20.4' }
          - { platform: fabric, minecraft: '1.20.5', loader: '0.19.3', java: 21, project: webshopx-fabric-modern, fabricApi: '0.97.8+1.20.5' }
          - { platform: fabric, minecraft: '26.2', loader: '0.19.3', java: 25, project: webshopx-fabric-modern, fabricApi: '0.158.0+26.2' }
          - { platform: forge, minecraft: '1.18.2', loader: '40.3.12', java: 17, project: webshopx-forge-1182, fabricApi: '' }
          - { platform: forge, minecraft: '1.19.4', loader: '45.4.3', java: 17, project: webshopx-forge-1182, fabricApi: '' }
          - { platform: forge, minecraft: '1.20', loader: '46.0.14', java: 17, project: webshopx-forge-1201, fabricApi: '' }
          - { platform: forge, minecraft: '1.20.1', loader: '47.4.23', java: 17, project: webshopx-forge-1201, fabricApi: '' }
          - { platform: neoforge, minecraft: '1.20.1', loader: '47.1.106', java: 17, project: webshopx-neoforge-1201, fabricApi: '' }
          - { platform: neoforge, minecraft: '1.20.2', loader: '20.2.93', java: 17, project: webshopx-neoforge-modern, fabricApi: '' }
          - { platform: neoforge, minecraft: '26.2', loader: '26.2.0.65', java: 25, project: webshopx-neoforge-modern, fabricApi: '' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Cc-Cece/webshopx-vuetify-web
          ref: f655cee059b85ec3b99eae4f3125fe262773edbd
          path: .frontend/webshopx-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .frontend/webshopx-web/pnpm-lock.yaml
      - name: Install pinned frontend dependencies
        working-directory: .frontend/webshopx-web
        run: pnpm install --frozen-lockfile
      - name: Install pinned automated player dependencies
        working-directory: docs/mod-migration/tools/minecraft-client
        run: npm ci --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=moderate
      - name: Cache pinned Minecraft console client
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/webshopx-mcc-player
          key: mcc-player-20260704-478-${{ runner.os }}-${{ runner.arch }}
      - name: Prepare pinned Minecraft console client
        shell: pwsh
        run: |
          $prepared = & docs/mod-migration/tools/prepare-mcc-player.ps1 `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'webshopx-mcc-player') |
            ConvertFrom-Json
          "WEBSHOPX_MCC_PLAYER=$($prepared.executable)" >> $env:GITHUB_ENV
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Build exact candidate
        run: >-
          ./gradlew :${{ matrix.project }}:jar
          :webshopx-fixture-mod:${{ matrix.platform }}FixtureJar --stacktrace
      - name: Prepare official Loader server
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'webshopx-server'
          $json = & docs/mod-migration/tools/prepare-dedicated-server.ps1 `
            -Platform '${{ matrix.platform }}' -Minecraft '${{ matrix.minecraft }}' `
            -Loader '${{ matrix.loader }}' -FabricApi '${{ matrix.fabricApi }}' `
            -WorkingDirectory $work -Java (Get-Command java).Source
          $server = $json | ConvertFrom-Json
          "WEBSHOPX_SERVER_WORK=$work" >> $env:GITHUB_ENV
          "WEBSHOPX_SERVER_JAR=$($server.serverJar)" >> $env:GITHUB_ENV
          "WEBSHOPX_LAUNCH_ARGS=$($server.launchArguments)" >> $env:GITHUB_ENV
      - name: Run native lifecycle, item and HTTP smoke
        shell: pwsh
        run: |
          $jar = Get-ChildItem '${{ matrix.project }}/build/libs/*.jar' | Select-Object -First 1
          $fixtureJar = Get-ChildItem 'webshopx-fixture-mod/build/fixture-libs/webshopx-fixture-${{ matrix.platform }}-*.jar' |
            Select-Object -First 1
          $fixtureCommands = & docs/mod-migration/tools/item-fixture-commands.ps1 `
            -Minecraft '${{ matrix.minecraft }}' | ConvertFrom-Json
          $playerClient = (Resolve-Path 'docs/mod-migration/tools/minecraft-client/player-probe.mjs').Path
          $playerArgs = @{
            Node = (Get-Command node).Source
            PlayerClientScript = $playerClient
            MccExecutable = $env:WEBSHOPX_MCC_PLAYER
          }
          $firstStart = & docs/mod-migration/tools/dedicated-server-smoke.ps1 `
            -Java (Get-Command java).Source -ServerJar $env:WEBSHOPX_SERVER_JAR `
            -LaunchArguments $env:WEBSHOPX_LAUNCH_ARGS -ModJar $jar.FullName -FixtureModJar $fixtureJar.FullName `
            -WorkingDirectory $env:WEBSHOPX_SERVER_WORK `
            -ExpectedMinecraft '${{ matrix.minecraft }}' -ExpectedLoader '${{ matrix.loader }}' `
            -HealthCommand 'webshopx-health' -ProbeCommand 'webshopx-item-probe' `
            -ExpectedProbePattern 'item-roundtrip=PASS','fixtures=PASS\(9,domain,hash,codec\)' `
            @playerArgs -VerifyInventory -VerifyItemFixtures -OnlinePlayerCommand $fixtureCommands `
            -EvidencePrefix 'first-start' | ConvertFrom-Json
          $restart = & docs/mod-migration/tools/dedicated-server-smoke.ps1 `
            -Java (Get-Command java).Source -ServerJar $env:WEBSHOPX_SERVER_JAR `
            -LaunchArguments $env:WEBSHOPX_LAUNCH_ARGS -ModJar $jar.FullName -FixtureModJar $fixtureJar.FullName `
            -WorkingDirectory $env:WEBSHOPX_SERVER_WORK `
            -ExpectedMinecraft '${{ matrix.minecraft }}' -ExpectedLoader '${{ matrix.loader }}' `
            -HealthCommand 'webshopx-health' -ProbeCommand 'webshopx-item-probe' `
            -ExpectedProbePattern 'item-roundtrip=PASS','fixtures=PASS\(9,domain,hash,codec\)' `
            @playerArgs -VerifyInventory -ExpectInventoryRecovery `
            -EvidencePrefix 'restart' | ConvertFrom-Json
          [ordered]@{ status = 'passed'; firstStart = $firstStart; restart = $restart } |
            ConvertTo-Json -Depth 10 |
            Set-Content (Join-Path $env:WEBSHOPX_SERVER_WORK 'smoke-evidence.json')
      - name: Freeze dedicated-server evidence
        shell: pwsh
        run: |
          $id = 'server-${{ matrix.platform }}-${{ matrix.minecraft }}'
          $evidencePaths = @(
            (Join-Path $env:WEBSHOPX_SERVER_WORK 'smoke-evidence.json'),
            (Join-Path $env:WEBSHOPX_SERVER_WORK 'config/webshopx/health.json'),
            (Join-Path $env:WEBSHOPX_SERVER_WORK 'config/webshopx/inventory-probe-online.json'),
            (Join-Path $env:WEBSHOPX_SERVER_WORK 'config/webshopx/inventory-probe-offline.json'),
            (Join-Path $env:WEBSHOPX_SERVER_WORK 'config/webshopx/inventory-probe-recovery.json'),
            (Join-Path $env:WEBSHOPX_SERVER_WORK 'config/webshopx/inventory-probe-fixture.json'))
          $evidencePaths += Get-ChildItem $env:WEBSHOPX_SERVER_WORK -Filter 'player-*-mcc*.log' |
            ForEach-Object FullName
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id $id -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/${{ matrix.platform }}-${{ matrix.loader }}/minecraft-${{ matrix.minecraft }}/java-${{ matrix.java }}' `
            -EvidencePath $evidencePaths `
            -OutputFile "build/required-checks/$id.check.json"
      - uses: actions/upload-artifact@v4
        with:
          name: server-evidence-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ github.sha }}
          if-no-files-found: error
          path: build/required-checks/*.check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-smoke-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ env.WEBSHOPX_SERVER_WORK }}/smoke-evidence.json
            ${{ env.WEBSHOPX_SERVER_WORK }}/console-*.log
            ${{ env.WEBSHOPX_SERVER_WORK }}/player-*.json
            ${{ env.WEBSHOPX_SERVER_WORK }}/player-*-mcc*.log
            ${{ env.WEBSHOPX_SERVER_WORK }}/logs/latest.log
            ${{ env.WEBSHOPX_SERVER_WORK }}/config/webshopx/health.json
            ${{ env.WEBSHOPX_SERVER_WORK }}/config/webshopx/inventory-probe-*.json

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - name: Compile CodeQL database
        run: ./gradlew classes :webshopx-loader-runtime:classes --stacktrace
      - uses: github/codeql-action/analyze@v4
      - name: Freeze CodeQL evidence
        shell: pwsh
        run: >-
          & docs/mod-migration/tools/write-check-evidence.ps1
          -Id 'codeql' -SourceCommit '${{ github.sha }}'
          -Environment 'ubuntu-latest/codeql-v4/java-kotlin'
          -EvidencePath @('build/classes','webshopx-loader-runtime/build/classes','.github/workflows/mod-migration.yml')
          -OutputFile 'build/required-checks/codeql.check.json'
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-evidence-${{ github.sha }}
          if-no-files-found: error
          path: build/required-checks/*.check.json

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Cc-Cece/webshopx-vuetify-web
          ref: f655cee059b85ec3b99eae4f3125fe262773edbd
          path: .frontend/webshopx-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .frontend/webshopx-web/pnpm-lock.yaml
      - name: Install pinned frontend dependencies
        working-directory: .frontend/webshopx-web
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Start shared HTTP fixture
        shell: bash
        run: |
          mkdir -p build/reports/mod-migration/browser build/tmp/browser-fixture
          ./gradlew :webshopx-core:browserAcceptanceFixture \
            -PbrowserFixturePort=8123 \
            -PbrowserFixtureDirectory="$PWD/build/tmp/browser-fixture" \
            > build/tmp/browser-fixture/fixture.log 2>&1 &
          echo $! > build/tmp/browser-fixture/gradle.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8123/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat build/tmp/browser-fixture/fixture.log
          exit 1
      - name: Install locked browser test dependencies and Chromium
        working-directory: docs/mod-migration/tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify visible public and authenticated critical journeys
        working-directory: docs/mod-migration/tools
        env:
          WEBSHOPX_BROWSER_BASE: http://127.0.0.1:8123
          WEBSHOPX_BROWSER_EVIDENCE: ${{ github.workspace }}/build/reports/mod-migration/browser
        run: npx playwright test browser-acceptance.spec.mjs --reporter=line
      - name: Stop shared HTTP fixture
        if: always()
        shell: bash
        run: |
          touch build/tmp/browser-fixture/stop
          if test -f build/tmp/browser-fixture/gradle.pid; then
            wait "$(cat build/tmp/browser-fixture/gradle.pid)" || true
          fi
      - name: Freeze browser evidence
        shell: pwsh
        run: |
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'browser-landing' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/playwright-1.62.1/chromium' `
            -EvidencePath @('build/reports/mod-migration/browser/landing.json','build/reports/mod-migration/browser/landing.png') `
            -OutputFile 'build/required-checks/browser-landing.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'browser-health' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/playwright-1.62.1/chromium' `
            -EvidencePath @('build/reports/mod-migration/browser/health.json','build/reports/mod-migration/browser/health.png') `
            -OutputFile 'build/required-checks/browser-health.check.json'
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'browser-critical-journeys' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/playwright-1.62.1/chromium' `
            -EvidencePath @('build/reports/mod-migration/browser/critical-journeys.json','build/reports/mod-migration/browser/critical-journeys.png','build/reports/mod-migration/browser/admin-permission-denied.json','build/reports/mod-migration/browser/admin-permission-denied.png') `
            -OutputFile 'build/required-checks/browser-critical-journeys.check.json'
          $routeScreenshots = Get-ChildItem 'build/reports/mod-migration/browser/route-*.png' | ForEach-Object FullName
          $routeEvidence = @('build/reports/mod-migration/browser/route-matrix.json') + $routeScreenshots
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'browser-route-matrix' -SourceCommit '${{ github.sha }}' `
            -Environment 'ubuntu-latest/playwright-1.62.1/chromium' `
            -EvidencePath $routeEvidence `
            -OutputFile 'build/required-checks/browser-route-matrix.check.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/reports/mod-migration/browser
            build/tmp/browser-fixture/fixture.log
            build/required-checks/*.check.json

  rc-readiness:
    needs: [contracts-and-artifacts, paper-regression, database-and-redis, database-mysql, dedicated-server-matrix, codeql, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Cc-Cece/webshopx-vuetify-web
          ref: f655cee059b85ec3b99eae4f3125fe262773edbd
          path: .frontend/webshopx-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .frontend/webshopx-web/pnpm-lock.yaml
      - name: Install pinned frontend dependencies
        working-directory: .frontend/webshopx-web
        run: pnpm install --frozen-lockfile
      - name: Install Java 17 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Java 21 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Java 25 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-evidence-${{ github.sha }}'
          path: build/required-check-input
          merge-multiple: true
      - name: Rebuild frozen local candidate
        run: ./gradlew localReadiness --rerun-tasks --stacktrace
      - name: Assemble immutable required-check packet
        shell: pwsh
        run: |
          $serverEvidence = Get-ChildItem 'build/required-check-input' `
            -Filter 'server-*.check.json' -File -Recurse | ForEach-Object FullName
          if (@($serverEvidence).Count -ne 13) {
            throw "Expected 13 dedicated-server evidence rows, found $(@($serverEvidence).Count)"
          }
          & docs/mod-migration/tools/write-check-evidence.ps1 `
            -Id 'real-player-item-corpus' -SourceCommit '${{ github.sha }}' `
            -Environment '13-row-fabric-forge-neoforge/real-MCC/controlled-fixture-mod' `
            -EvidencePath $serverEvidence `
            -OutputFile 'build/required-check-input/real-player-item-corpus.check.json'
          & docs/mod-migration/tools/assemble-rc-evidence.ps1 `
            -SourceCommit '${{ github.sha }}' -EvidenceDirectory 'build/required-check-input' `
            -ReleaseManifest 'build/reports/mod-migration/release-manifest.json' `
            -Sbom 'build/reports/mod-migration/mod-sbom.spdx.json' `
            -OutputFile 'build/reports/mod-migration/required-checks.json'
      - name: Enforce RC readiness
        run: ./gradlew releaseReadiness -PrcEvidence=build/reports/mod-migration/required-checks.json --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rc-readiness-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/reports/mod-migration/required-checks.json
            build/reports/mod-migration/release-manifest.json
            build/reports/mod-migration/mod-sbom.spdx.json
            build/reports/mod-migration/readiness.json
