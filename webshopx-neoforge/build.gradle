plugins {
    id 'java'
}

group = rootProject.group
version = rootProject.version

String targetRuntime = rootProject.hasProperty('targetRuntime')
        ? rootProject.property('targetRuntime').toString().trim().toLowerCase(java.util.Locale.ROOT)
        : '1.20.6+'
boolean legacy18Runtime = targetRuntime == '1.18.2+'
int runtimeJavaLanguageVersion = legacy18Runtime ? 17 : 21
JavaVersion runtimeJavaVersion = legacy18Runtime ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21

java {
    sourceCompatibility = runtimeJavaVersion
    targetCompatibility = runtimeJavaVersion
}

repositories {
    mavenCentral()
    maven {
        name = 'neoforged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'minecraft'
        url = 'https://libraries.minecraft.net'
    }
}

dependencies {
    implementation project(':webshopx-core')
    compileOnly 'net.neoforged.fancymodloader:loader:4.0.42'
    compileOnly 'net.neoforged:bus:8.0.5'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
}

tasks.withType(JavaCompile).configureEach {
    options.release = runtimeJavaLanguageVersion
}

processResources {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'WebShopX NeoForge M2',
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'com.webshopx.neoforge'
        )
    }
}

tasks.register('runM2NeoForgeSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the NeoForge M2 runtime smoke bootstrap without game runtime.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.webshopx.neoforge.WebShopXNeoForgeSmoke'
}
