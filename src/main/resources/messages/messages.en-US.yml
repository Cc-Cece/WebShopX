gui:
  market:
    title:
      main: "Market Center"
      manage: "My Listings"
      detail: "Listing #{listingId}"
      supply_template: "Supply Template"
      manual: "Manual Listing"
    common:
      back:
        title: "Back"
        subtitle: "Return to market center"
      refresh:
        title: "Refresh"
        subtitle: "Reload latest state"
    main:
      manual:
        title: "Manual Listing"
        subtitle: "Place items and enter the price to create"
        lore:
          - "Default currency: GAME_COIN"
          - "Change remark and currency later on the website"
      supply:
        title: "Supply Listing"
        subtitle: "Click the supply container, then place 1 template item"
        lore:
          - "Supports double chest, chest, barrel, shulker box"
          - "Uses the server default transfer and transit settings"
      manage:
        title: "My Listings"
        subtitle: "View and manage your active listings"
        lore:
          - "Supports pause / resume / unlist"
          - "Supply listings also support manual refresh"
    manage:
      empty:
        title: "No Listings"
        subtitle: "There are no listings to manage"
        lore:
          - "Go back to the main menu to create one"
    input:
      cancel:
        title: "Cancel"
        subtitle: "Abort and return all items"
        lore:
          - "Typing cancel in chat also aborts"
      next:
        title: "Next"
        subtitle: "Close the GUI and enter the price in chat"
        manual_lore:
          - "Everything you place will be listed"
          - "Default currency: GAME_COIN"
        supply:
          lore_template: "Place exactly 1 template item"
          lore_currency: "Default currency: GAME_COIN"
          lore_source_missing: "Supply source: not bound"
          lore_source: "Supply source: {world} {x} {y} {z}"
      info:
        manual:
          title: "Manual Listing"
          subtitle: "Place the items to sell in the first 45 slots"
          lore:
            - "Only one item type is allowed"
            - "Other settings can be edited on the website"
        supply:
          title: "Supply Listing"
          subtitle: "Place 1 template item in the first 45 slots"
          lore:
            - "Other parameters use server defaults"
            - "Edit supply settings and remarks on the website"
    detail:
      web_edit:
        title: "Edit on Website"
        subtitle: "Price, currency, remark, and supply settings are website-only"
        lore:
          - "Keep in-game input minimal"
          - "Add richer settings on the website"
      refresh:
        title: "Refresh Supply"
        subtitle: "Check the container and load stock once"
        transit: "Transit stock: {current}/{max}"
        batch: "Transfer batch: {value}"
        loaded_total: "Total loaded: {value}"
        sold_total: "Total sold: {value}"
        last_loaded_empty: "Last refill: never"
        last_loaded: "Last refill: {value}"
      pause:
        title: "Pause Listing"
        subtitle: "Temporarily stop selling"
      resume:
        title: "Resume Listing"
        subtitle: "Make the listing public again"
      unlist:
        title: "Unlist and Return"
        subtitle: "Return current stock to the game"
      back:
        title: "Back to List"
        subtitle: "Return to My Listings"
    listing:
      status: "Status: §f{value}"
      price: "Price: §f{price} {currency}"
      stock: "Stock: §f{current}/{max}"
      mode: "Mode: §f{value}"
      batch: "Transfer batch: §f{value}"
      loaded_total: "Total loaded: §f{value}"
      remark: "Remark: §f{value}"
      remark_placeholder: "Remark: §8editable on the website"
      created_at: "Created at: §f{value}"
      click_open: "Click to open details"

