<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=app/#/webshopx/help" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebShopX Help</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var rawHash = (window.location.hash || "").replace(/^#/, "").trim();
      if (rawHash && !params.has("section")) {
        try {
          params.set("section", decodeURIComponent(rawHash));
        } catch (error) {
          params.set("section", rawHash);
        }
      }
      var query = params.toString();
      var target = "app/#/webshopx/help" + (query ? "?" + query : "");
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>正在跳转到 WebShopX 帮助中心...</p>
</body>
</html>
