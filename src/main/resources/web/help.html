<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebShopX - 帮助中心</title>
  <script>
    (function bootstrapTheme() {
      try {
        var saved = window.localStorage.getItem("webshopx_theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.remove("mdui-theme-light", "mdui-theme-dark");
        document.documentElement.classList.add(theme === "dark" ? "mdui-theme-dark" : "mdui-theme-light");
      } catch (error) {
        document.documentElement.classList.add("mdui-theme-light");
      }
    })();
  </script>
  <link rel="stylesheet" href="lib/mdui.css" />
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>
<body class="wsx-page wsx-help-page">
  <mdui-layout class="wsx-layout help-shell">
    <mdui-top-app-bar>
      <mdui-top-app-bar-title>WebShopX 帮助中心</mdui-top-app-bar-title>
      <div class="wsx-toolbar" id="helpHeaderActions" slot="end-icon">
        <mdui-select id="helpDocSelect" label="文档" class="help-header-select"></mdui-select>
        <mdui-text-field id="helpSearchInput" label="搜索" clearable class="help-header-search"></mdui-text-field>
        <mdui-button id="helpMenuBtn" variant="tonal" icon="menu" style="display: none;"></mdui-button>
        <mdui-button id="helpHomeBtn" href="index.html">返回商城</mdui-button>
        <mdui-button id="helpThemeToggleBtn" variant="tonal">切换主题</mdui-button>
        <mdui-button id="helpModeToggleBtn" variant="tonal">单页模式</mdui-button>
        <mdui-button id="helpReloadBtn" variant="outlined">重新加载</mdui-button>
      </div>
    </mdui-top-app-bar>

    <mdui-linear-progress id="helpProgress" style="display: none;"></mdui-linear-progress>

    <mdui-layout-main class="wsx-main">
      <div class="wsx-help-layout">
        <nav class="help-toc-container">
          <div class="help-mobile-actions">
            <mdui-select id="helpMenuDocSelect" label="文档"></mdui-select>
            <div class="wsx-action-row">
              <mdui-button id="helpMenuHomeBtn" variant="tonal">返回商城</mdui-button>
              <mdui-button id="helpMenuThemeBtn" variant="tonal">切换主题</mdui-button>
              <mdui-button id="helpMenuModeBtn" variant="tonal">单页模式</mdui-button>
              <mdui-button id="helpMenuReloadBtn" variant="outlined">重新加载</mdui-button>
            </div>
          </div>
          <div id="helpToc" class="wsx-stack"></div>
        </nav>

        <mdui-card class="wsx-card help-doc">
          <div id="helpMeta" class="wsx-muted"></div>
          <article id="helpContent" class="wsx-help-content"></article>
        </mdui-card>
      </div>

      <div id="helpSearchResults" class="help-search-popup" style="display: none;"></div>
    </mdui-layout-main>
  </mdui-layout>

  <script src="lib/mdui.global.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script type="module" src="js/help.js"></script>
</body>
</html>
