# ============================================================
# WebShopX 最小启动配置
# 运行时/业务设置存储在数据库中，并在 Web 管理后台维护。
# 升级后首次启动会自动迁移旧配置项。
# 英文版本及文档: https://docs.akihito.dpdns.org/
# ============================================================

webshop:
  # server-mode: internal | external | relay
  # relay 模式通过 WebShopX Relay 提供公网访问。
  # internal: 启用内置静态网页 + API
  # external: 仅启用 API（静态资源由反向代理/CDN 提供）
  server-mode: internal
  # 用户实际访问的前端地址；留空时由当前请求推断。
  public-url: ""

  # 引导管理员账号，仅用于首次初始化。
  # 首次登录后请创建新管理员并关闭此功能。
  admin-bootstrap:
    enabled: true
    username: admin
    password: admin123456
    role: SUPER_ADMIN

  embedded-http:
    host: 0.0.0.0
    port: 8819
    static-root: web
    # API 对外公开的完整根地址（应包含 /api）；留空时内置页面使用同源 /api。
    # 旧版 webshop.api-base-url 仍会被自动读取，迁移后建议改用本项。
    public-api-url: ""
    # CORS (跨源资源共享) 配置
    # 允许第三方外置网页(如 webshopx-web)跨域访问。
    cors:
      # 默认关闭以确保安全。
      enabled: false
      # 允许跨域的域名列表。使用 "*" 允许所有域名跨域访问。
      allowed-origins:
        - "*"
  textures:
    # 按 priority 从高到低覆盖。支持标准资源包 ZIP 或已解压目录。
    # 相对路径从服务器根目录解析；列表留空时自动扫描 plugins/WebShopX/resourcepacks。
    resource-packs: []
  business-ledger:
    enabled: true
    directory: logs/business-ledger
    retention-days: 30

relay:
  # 仅在 webshop.server-mode=relay 时生效；非 relay 模式下可忽略本节。
  # 留空时使用官方 Relay 地址；保留此项以便后续迁移或自建服务。
  url: ""
  # Relay 用户信息页面中生成的访问密钥。
  access-key: ""

database:
  # mysql | mariadb | sqlite
  # 为了快速上手，默认使用 sqlite。
  # 强烈建议生产环境使用 mysql 或 mariadb（性能/并发/稳定性更好）。
  type: sqlite
  # 以下配置（host-server-rsa-public-key-file）仅在 database.type=mysql 或 mariadb 时生效。
  host: 127.0.0.1
  port: 3306
  schema: webshop
  username: webshop
  password: change_me
  use-ssl: false
  # MySQL 8 / MariaDB 在非 TLS 且使用 caching_sha2_password 时的兼容选项。
  allow-public-key-retrieval: true
  # 可选：服务端 RSA 公钥文件绝对路径或 PEM 文本。
  server-rsa-public-key-file: ""
  # 仅在 database.type=sqlite 时生效。
  sqlite-file: plugins/WebShopX/webshopx.db
  pool-size: 10

cluster:
  # standalone | master | node
  role: standalone
  server-id: standalone
  presence-ttl-seconds: 120

redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
  password: ""
  # 市场广播频道
  broadcast-channel: webshopx:market:broadcast
  # 集群控制/事件频道
  cluster-channel: webshopx:cluster:event
  # 旧版别名（可选）
  channel: webshopx:market:broadcast

