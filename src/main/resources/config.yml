# ============================================================
# WebShopX 配置
# 已迁移到数据库并可在后台管理的配置：
#   - exchange
#   - economy.market.trade-fee-percent / trade-tax-percent
#   - webshop.leaderboard
#   - currency
# 其余运行参数仍保留在 config.yml（含 admin-bootstrap / logging / maintenance / broadcast）。
# ============================================================

webshop:
  # internal: 内置 Web/API
  # external: 仅后端 API（静态资源走外部反代）
  server-mode: internal
  api-base-url: ""
  default-locale: zh-CN
  session-expire-hours: 72
  bind-request-expire-minutes: 15
  access-token-length: 48
  time-zone: Asia/Shanghai
  delivery-batch-size: 20
  delivery-retry-seconds: 30
  order-cooldown-seconds: 15
  allow-shared-claim-command: false
  refund-undelivered-enabled: true
  market:
    max-active-listings: 10
    supply:
      auto-refresh-threshold: 8
      default-transfer-batch-size: 64
      max-transfer-batch-size: 256
      default-transit-stock: 256
      max-transit-stock: 1024
  leaderboard:
    enabled: true
    show-online-status: true
    default-metric: GAME_COIN
    default-order: DESC
  broadcast:
    enabled: true
    templates:
      listing-created: "&6[市场]&r &e{seller}&r 上架了 &b{item}&r x{quantity}，单价 {priceText}"
      trade-success: "&6[市场]&r &e{buyer}&r 购买了 &b{item}&r x{quantity}，成交总价 {totalText}"
      auction-bid: "&6[拍卖]&r &e{bidder}&r 对拍卖 #{listingId} 出价 {bidAmountText}"
      auction-sealed-bid: "&6[拍卖]&r 拍卖 #{listingId} 收到新的密封出价"
  maintenance:
    cleanup-interval-minutes: 30
    pending-bind-retention-hours: 6
    pending-password-retention-hours: 6
    bind-request-retention-hours: 24
    redeem-code-retention-days: 7
  logging:
    enabled: true
    level: INFO
    directory: logs
    max-file-size-mb: 8
    max-files: 8
    retention-days: 14
  admin-bootstrap:
    enabled: true
    username: admin
    password: admin123456
    role: SUPER_ADMIN
  embedded-http:
    host: 0.0.0.0
    port: 8819
    static-root: web

exchange:
  shopcoin-to-gamecoin:
    enabled: true
    ratio: 1.0
  gamecoin-to-shopcoin:
    enabled: false
    ratio: 1.0

currency:
  shopcoin:
    name: ShopCoin
    short: SC
  gamecoin:
    name: GameCoin
    short: GC

economy:
  market:
    trade-fee-percent: 0.0
    trade-tax-percent: 0.0
  inflation-control:
    mode: burn
    treasury-user-id: 0

database:
  # mysql | mariadb | sqlite
  type: mysql
  host: 127.0.0.1
  port: 3306
  schema: webshop
  username: webshop
  password: change_me
  use-ssl: false
  # Non-TLS compatibility for MySQL 8 / MariaDB accounts using caching_sha2_password.
  allow-public-key-retrieval: true
  # Optional: absolute path to a server RSA public key file or PEM text.
  server-rsa-public-key-file: ""
  # Used only when database.type=sqlite.
  sqlite-file: data/webshopx.db
  # SQLite journal mode: DELETE | TRUNCATE | PERSIST | MEMORY | WAL | OFF
  sqlite-journal-mode: WAL
  # SQLite synchronous level: OFF | NORMAL | FULL | EXTRA
  sqlite-synchronous: NORMAL
  # SQLite lock wait timeout (milliseconds)
  sqlite-busy-timeout-ms: 5000
  # SQLite bounded retries for lock/contention failures (0-10)
  sqlite-max-retries: 5
  # SQLite retry backoff sequence in milliseconds
  sqlite-retry-backoff-ms: [10, 50, 100]
  pool-size: 10

cluster:
  # standalone | master | node
  role: standalone
  server-id: standalone
  presence-ttl-seconds: 120

redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
  password: ""
  # 市场广播频道
  broadcast-channel: webshopx:market:broadcast
  # 集群配置刷新等控制事件频道
  cluster-channel: webshopx:cluster:event
  # 兼容旧字段（可删）
  channel: webshopx:market:broadcast

sample-products:
  - sku: vip_week
    title: VIP Week Pass
    currency: SHOP_COIN
    price: 100
    command-template: "lp user {player} parent addtemp vip 7d"
  - sku: diamond_pack
    title: Diamond Pack x32
    currency: GAME_COIN
    price: 50
    command-template: "give {player} minecraft:diamond 32"
