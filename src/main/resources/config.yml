# ============================================================
# WebShopX 配置文件
# 说明：
# 1) 修改后可使用 /webshopx reload（或 /ws reload）热重载大部分配置。
# 2) 涉及数据库连接参数时，建议重启服务器。
# 3) 币值默认按整数处理，避免浮点精度问题。
# ============================================================

webshop:
  # Web runtime mode
  # - internal: 使用内置服务器（默认，适合快速上手）
  # - external: 仅提供后端服务，前端由外部 Nginx 等托管（适合生产环境，需自行配置 nginx）
  server-mode: internal

  # 玩家登录会话有效期（小时）
  session-expire-hours: 72
  # 注册绑定码有效期（分钟）
  bind-request-expire-minutes: 15
  # API 会话令牌长度（建议 32-64）
  access-token-length: 48

  # 每轮发货处理的订单数量
  delivery-batch-size: 20
  # 发货失败后重试间隔（秒）
  delivery-retry-seconds: 30
  # 订单冷静期（秒，0 表示关闭）
  order-cooldown-seconds: 15
  # 是否允许非订单本人使用领取命令在游戏内代领（非本人无法领取时也可复制命令）
  allow-shared-claim-command: false
  # 是否允许所有未发放内容退款（PENDING / WAIT_CLAIM / 未核销团购券）
  refund-undelivered-enabled: true

  market:
    # 玩家市场默认最大上架数
    max-active-listings: 10

  maintenance:
    # 清理任务执行间隔（分钟）
    cleanup-interval-minutes: 30
    # 待绑定账号保留时长（小时）
    pending-bind-retention-hours: 6
    # 待设置密码账号保留时长（小时）
    pending-password-retention-hours: 6
    # 绑定码记录保留时长（小时）
    bind-request-retention-hours: 24
    # 已失效兑换码保留时长（天）
    redeem-code-retention-days: 7

  logging:
    # 是否启用插件文件日志
    enabled: true
    # 日志级别：ERROR | WARN | INFO | DEBUG | TRACE
    level: INFO
    # 日志目录（相对于插件数据目录）
    directory: logs
    # 单个日志文件最大体积（MB）
    max-file-size-mb: 8
    # 最多保留的滚动文件数
    max-files: 8
    # 超过该天数的日志文件将被维护任务清理（<=0 表示不清理）
    retention-days: 14

  admin-bootstrap:
    # 首次启动自动创建管理员
    enabled: true
    username: admin
    password: admin123456
    role: SUPER_ADMIN

  embedded-http:
    host: 0.0.0.0
    port: 8819
    static-root: web

database:
  host: 127.0.0.1
  port: 3306
  schema: webshop
  username: webshop
  password: change_me
  use-ssl: false
  pool-size: 10

exchange:
  # ShopCoin -> GameCoin
  shopcoin-to-gamecoin:
    enabled: true
    ratio: 1.0
  # GameCoin -> ShopCoin
  gamecoin-to-shopcoin:
    enabled: false
    ratio: 1.0

currency:
  shopcoin:
    name: ShopCoin
    short: SC
  gamecoin:
    name: GameCoin
    short: GC

economy:
  market:
    # 手续费（卖家侧，百分比）
    trade-fee-percent: 0.0
    # 税率（买家侧，百分比）
    trade-tax-percent: 0.0
  inflation-control:
    # 可选：burn | treasury
    mode: burn
    treasury-user-id: 0

redis:
  enabled: false
  host: 127.0.0.1
  port: 6379

sample-products:
  - sku: vip_week
    title: VIP Week Pass
    currency: SHOP_COIN
    price: 100
    command-template: "lp user {player} parent addtemp vip 7d"
  - sku: diamond_pack
    title: Diamond Pack x32
    currency: GAME_COIN
    price: 50
    command-template: "give {player} minecraft:diamond 32"
