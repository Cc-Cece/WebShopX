webshop:
  web-mode: embedded_http
  session-expire-hours: 72
  bind-request-expire-minutes: 15
  access-token-length: 48
  delivery-batch-size: 20
  delivery-retry-seconds: 30
  order-cooldown-seconds: 15
  market:
    max-active-listings: 10
  maintenance:
    cleanup-interval-minutes: 30
    pending-bind-retention-hours: 6
    pending-password-retention-hours: 6
    bind-request-retention-hours: 24
    redeem-code-retention-days: 7
  admin-bootstrap:
    enabled: true
    username: admin
    password: admin123456
    role: SUPER_ADMIN
  embedded-http:
    host: 0.0.0.0
    port: 8819
    static-root: web

database:
  host: 127.0.0.1
  port: 3306
  schema: webshop
  username: webshop
  password: change_me
  use-ssl: false
  pool-size: 10

exchange:
  shopcoin-to-gamecoin:
    enabled: true
    ratio: 1.0
  gamecoin-to-shopcoin:
    enabled: false
    ratio: 1.0

currency:
  shopcoin:
    name: ShopCoin
    short: SC
  gamecoin:
    name: GameCoin
    short: GC

economy:
  market:
    trade-fee-percent: 0.0
    trade-tax-percent: 0.0
  inflation-control:
    mode: burn
    treasury-user-id: 0

redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
