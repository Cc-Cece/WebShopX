# ============================================================
# WebShopX Minimal Startup Config
# Runtime/business settings are stored in DB and managed in Web Admin.
# Legacy keys will be auto-migrated on first startup after upgrade.
# ============================================================

webshop:
  # internal: serve built-in static web + API
  # external: API only (static files served by reverse proxy/CDN)
  server-mode: internal
  api-base-url: ""

  # Bootstrap admin account used only for first-time setup.
  # After login, create a new admin and disable this.
  admin-bootstrap:
    enabled: true
    username: admin
    password: admin123456
    role: SUPER_ADMIN

  embedded-http:
    host: 0.0.0.0
    port: 8819
    static-root: web

database:
  # mysql | mariadb | sqlite
  type: mysql
  host: 127.0.0.1
  port: 3306
  schema: webshop
  username: webshop
  password: change_me
  use-ssl: false
  # Non-TLS compatibility for MySQL 8 / MariaDB accounts using caching_sha2_password.
  allow-public-key-retrieval: true
  # Optional: absolute path to a server RSA public key file or PEM text.
  server-rsa-public-key-file: ""
  # Used only when database.type=sqlite.
  sqlite-file: data/webshopx.db
  pool-size: 10

cluster:
  # standalone | master | node
  role: standalone
  server-id: standalone
  presence-ttl-seconds: 120

redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
  password: ""
  # Market broadcast channel
  broadcast-channel: webshopx:market:broadcast
  # Cluster control/event channel
  cluster-channel: webshopx:cluster:event
  # Legacy alias (optional)
  channel: webshopx:market:broadcast
